<script>
  /**
   * LabPulse single-page client. The browser only displays data and reports what the phone
   * observed; every decision is made on the server (SRS §3.2).
   */
  (function () {
    'use strict';

    var BOOT = window.BOOT || {};
    var S = {
      init: BOOT.init || null,
      lab: null,
      tab: null,
      status: null,
      occ: null,
      checkin: null,
      sections: {},
      active: [],
      roster: { sessionId: null, date: null },
      report: { kind: 'daily' }
    };

    /* ================= helpers ================= */

    function esc(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function can(a) { return !!(S.init && S.init.allowed.indexOf(a) !== -1); }
    function role() { return S.init && S.init.me ? S.init.me.role : null; }
    function rid() {
      return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    var TZ = { timeZone: 'Asia/Kolkata' };
    function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString('en-IN', Object.assign({ hour: '2-digit', minute: '2-digit' }, TZ)) : ''; }
    function fmtDT(iso) { return iso ? new Date(iso).toLocaleString('en-IN', Object.assign({ day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }, TZ)) : ''; }
    function dur(ms) {
      var m = Math.max(0, Math.floor(ms / 60000));
      return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm';
    }
    function todayKey() { return new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10); }
    function monthKey() { return todayKey().slice(0, 7); }
    function toLocalInput(iso) {
      var d = new Date(new Date(iso).getTime() + 330 * 60000);
      return d.toISOString().slice(0, 16);
    }
    function fromLocalInput(v) { return v ? new Date(v + ':00+05:30').toISOString() : ''; }

    /** google.script.run as a promise. Server replies {ok, data} or {ok:false, code, message}. */
    function call(action, payload) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (r) {
            if (r && r.ok) resolve(r.data);
            else reject(r || { code: 'SERVER', message: 'Unexpected response from the server.' });
          })
          .withFailureHandler(function (e) {
            reject({ code: 'NETWORK', message: (e && e.message) || 'Network problem. Check your connection.' });
          })
          .api(action, payload || {});
      });
    }

    function toast(msg, kind) {
      var root = document.getElementById('toast-root');
      var el = document.createElement('div');
      var cls = kind === 'error' ? 'bg-red-700' : kind === 'warn' ? 'bg-amber-600' : 'bg-slate-900';
      el.className = cls + ' text-white text-sm px-4 py-2.5 rounded-lg shadow-lg max-w-md pointer-events-auto';
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(function () { el.remove(); }, kind === 'error' ? 6000 : 3500);
    }

    function badge(color, text) { return '<span class="lp-badge lp-' + color + '">' + esc(text) + '</span>'; }

    /** Status colours are always paired with a word (NFR ease of use). */
    function visitBadge(v) {
      if (!v) return '';
      if (v.status === 'VOIDED' || v.review_status === 'DECLINED') return badge('red', 'Declined');
      if (v.review_status === 'PENDING') return badge('amber', 'Pending review');
      if (v.confidence === 'MANUAL') return badge('blue', 'Manual entry');
      if (v.review_status === 'CONFIRMED') return badge('green', 'Confirmed');
      if (v.confidence === 'GREEN') return badge('green', 'Verified');
      return badge('gray', v.confidence || '—');
    }
    function assetBadge(s) {
      var m = { IN_USE: ['blue', 'In use'], AVAILABLE: ['green', 'Available'], RESERVED: ['amber', 'Reserved'], ISSUED: ['blue', 'Issued'], UNAVAILABLE: ['gray', 'Unavailable'], MAINTENANCE: ['gray', 'Maintenance'], RETIRED: ['gray', 'Retired'] }[s] || ['gray', s];
      return badge(m[0], m[1]);
    }
    function closeLabel(t) {
      return { MANUAL: 'Checked out', AUTO_DURATION: 'Auto-closed (session ended)', AUTO_CLOSING: 'Auto-closed (lab closed)', AUTO_SWITCH: 'Closed (moved to another lab)', STAFF: 'Closed by staff', VOIDED: 'Voided' }[t] || '';
    }
    function entryLabel(t) { return { COURSE: 'Lab course', EVENT: 'Event / workshop', RESEARCH: 'Individual research' }[t] || t; }

    function errorBox(e) {
      var denied = e && (e.code === 'FORBIDDEN' || e.code === 'NOT_REGISTERED' || e.code === 'INACTIVE');
      return '<div class="rounded-lg p-3 text-sm ' + (denied ? 'bg-slate-50 text-slate-600' : 'bg-red-50 text-red-800') + '">' +
        (denied ? '<b>Not available for your role.</b> ' : '<b>Could not load.</b> ') + esc(e && e.message) +
        (denied ? '' : ' <button class="underline ml-1" data-act="reload-sections">Retry</button>') + '</div>';
    }
    function empty(text) { return '<p class="text-sm text-slate-500 py-3">' + esc(text) + '</p>'; }
    function skeleton(h) { return '<div class="lp-skeleton" style="height:' + (h || 72) + 'px"></div>'; }
    function card(title, body, extra) {
      return '<section class="lp-card p-4">' + (title ? '<div class="flex items-center justify-between gap-2 mb-3"><h2 class="font-semibold text-slate-800">' + title + '</h2>' + (extra || '') + '</div>' : '') + body + '</section>';
    }
    function table(cols, rows) {
      return '<div class="lp-scroll"><table class="lp-table"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
        '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    }
    function field(label, inner) { return '<label class="block"><span class="lp-label">' + esc(label) + '</span>' + inner + '</label>'; }
    function input(name, value, attrs) { return '<input class="lp-input" name="' + name + '" value="' + esc(value === undefined || value === null ? '' : value) + '" ' + (attrs || '') + '>'; }
    function select(name, options, value, attrs) {
      return '<select class="lp-input" name="' + name + '" ' + (attrs || '') + '>' + options.map(function (o) {
        var v = Array.isArray(o) ? o[0] : o;
        var t = Array.isArray(o) ? o[1] : o;
        return '<option value="' + esc(v) + '"' + (String(v) === String(value) ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select>';
    }
    function formData(form) {
      var o = {};
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.name) return;
        if (el.type === 'checkbox') o[el.name] = el.checked;
        else o[el.name] = el.value;
      });
      return o;
    }
    function download(filename, text, type) {
      var blob = new Blob([text], { type: type || 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    function labOptions() { return (S.init.labs || []).map(function (l) { return [l.lab_id, l.name]; }); }
    function curLab() {
      var labs = S.init.labs || [];
      return labs.filter(function (l) { return l.lab_id === S.lab; })[0] || labs[0] || null;
    }

    /* ================= sections (independently loaded regions) ================= */

    function section(id, def) {
      S.sections[id] = def;
      S.active.push(id);
      return '<div id="sec-' + id + '">' + (def.data !== undefined && def.keep ? def.html(def.data) : skeleton(def.height)) + '</div>';
    }
    function loadSection(id) {
      var d = S.sections[id];
      if (!d) return Promise.resolve();
      return d.load().then(function (data) {
        d.data = data;
        d.error = null;
      }, function (e) {
        d.error = e;
      }).then(function () { paintSection(id); });
    }
    function paintSection(id) {
      var d = S.sections[id];
      var el = document.getElementById('sec-' + id);
      if (!d || !el) return;
      el.innerHTML = d.error ? errorBox(d.error) : d.html(d.data);
    }
    function loadAll() { S.active.forEach(loadSection); }

    /* ================= modal ================= */

    function openModal(title, body, onSubmit, submitLabel) {
      var root = document.getElementById('modal-root');
      root.innerHTML =
        '<div class="fixed inset-0 bg-slate-900/50 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4" data-act="modal-backdrop">' +
        '<form class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 max-h-[92vh] overflow-y-auto" id="modal-form">' +
        '<div class="flex items-start justify-between gap-3 mb-4"><h3 class="font-semibold text-lg">' + esc(title) + '</h3>' +
        '<button type="button" class="text-slate-400 text-2xl leading-none" data-act="modal-close" aria-label="Close">&times;</button></div>' +
        '<div class="space-y-3">' + body + '</div>' +
        '<div id="modal-error" class="hidden mt-3 rounded-lg bg-red-50 text-red-800 text-sm p-3"></div>' +
        (onSubmit ? '<div class="flex justify-end gap-2 mt-5"><button type="button" class="lp-btn lp-btn-ghost" data-act="modal-close">Cancel</button>' +
          '<button class="lp-btn lp-btn-primary" id="modal-submit">' + esc(submitLabel || 'Save') + '</button></div>' : '') +
        '</form></div>';
      var form = document.getElementById('modal-form');
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!onSubmit) return;
        var btn = document.getElementById('modal-submit');
        var err = document.getElementById('modal-error');
        btn.disabled = true;
        btn.innerHTML = '<span class="lp-spin"></span> Working…';
        err.classList.add('hidden');
        Promise.resolve(onSubmit(formData(form), form)).then(function (keepOpen) {
          if (!keepOpen) closeModal();
        }, function (e) {
          err.textContent = e && e.message ? e.message : 'Something went wrong.';
          err.classList.remove('hidden');
        }).then(function () {
          if (document.getElementById('modal-submit')) {
            btn.disabled = false;
            btn.textContent = submitLabel || 'Save';
          }
        });
      });
      var first = form.querySelector('input,select,textarea');
      if (first) first.focus();
    }
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    /* ================= shell ================= */

    var ROLE_NAMES = { STUDENT: 'Student', FACULTY: 'Faculty', STAFF: 'Lab staff', COORDINATOR: 'Lab coordinator', HOD: 'HOD', SUPER_ADMIN: 'Super Admin' };
    var ROLE_OPTIONS = ['STUDENT', 'FACULTY', 'STAFF', 'COORDINATOR', 'HOD', 'SUPER_ADMIN'].map(function (r) { return [r, ROLE_NAMES[r]]; });

    var TABS = [
      { id: 'home', label: 'Home', show: function () { return role() === 'STUDENT'; }, view: viewHome },
      { id: 'projects', label: 'My projects', show: function () { return role() === 'STUDENT'; }, view: viewProjects },
      { id: 'history', label: 'My history', show: function () { return role() === 'STUDENT'; }, view: viewHistory },
      { id: 'live', label: 'Live', show: function () { return can('staffSummary'); }, view: viewLive },
      { id: 'sessions', label: 'My sessions', show: function () { return can('facultySessions'); }, view: viewFaculty },
      { id: 'reviews', label: 'Reviews', show: function () { return can('reviewQueue'); }, view: viewReviews },
      { id: 'inventory', label: 'Inventory', show: function () { return can('inventory'); }, view: viewInventory },
      { id: 'courses', label: 'Courses & events', show: function () { return can('sessions'); }, view: viewCourses },
      { id: 'lookup', label: 'Lookup', show: function () { return can('lookupStudent') || can('lookupAsset'); }, view: viewLookup },
      { id: 'labprojects', label: 'Projects', show: function () { return role() !== 'STUDENT' && can('projects'); }, view: viewProjects },
      { id: 'reports', label: 'Reports', show: function () { return can('reportDaily') || can('exportRange'); }, view: viewReports },
      { id: 'settings', label: 'Settings', show: function () { return can('settingsGet'); }, view: viewSettings },
      { id: 'students', label: 'Students', show: function () { return can('students') && !can('users'); }, view: viewStudents },
      { id: 'people', label: 'People', show: function () { return can('users'); }, view: viewPeople },
      { id: 'audit', label: 'Audit', show: function () { return can('audit'); }, view: viewAudit }
    ];
    function visibleTabs() { return TABS.filter(function (t) { return t.show(); }); }

    function header() {
      var me = S.init.me;
      var labs = S.init.labs || [];
      var roleName = ROLE_NAMES[me.role] || '';
      return '<header class="bg-white border-b border-slate-200 sticky top-0 z-30">' +
        '<div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">' +
        '<div class="flex items-center gap-2 mr-auto"><div class="w-8 h-8 rounded-lg bg-teal-700 text-white grid place-items-center font-black">L</div>' +
        '<div><div class="font-bold leading-tight">LabPulse</div><div class="text-xs text-slate-500 leading-tight">' + esc(me.name || me.email) + (roleName ? ' · ' + roleName : '') + '</div></div></div>' +
        (labs.length > 1 ? '<select class="lp-input !w-auto !py-1.5 text-sm" id="lab-select">' + labs.map(function (l) {
          return '<option value="' + esc(l.lab_id) + '"' + (l.lab_id === S.lab ? ' selected' : '') + '>' + esc(l.name) + '</option>';
        }).join('') + '</select>' : '<span class="text-sm text-slate-600 font-medium">' + esc(curLab() ? curLab().name : '') + '</span>') +
        '<div id="occ-pill">' + occPill() + '</div>' +
        '</div>' +
        '<nav class="max-w-7xl mx-auto px-2 flex overflow-x-auto" role="tablist">' + visibleTabs().map(function (t) {
          return '<button class="lp-tab" role="tab" aria-selected="' + (t.id === S.tab) + '" data-act="tab" data-tab="' + t.id + '">' + esc(t.label) + '</button>';
        }).join('') + '</nav></header>';
    }

    function occPill() {
      var n = S.occ;
      return '<div class="flex items-center gap-2 rounded-full bg-teal-50 text-teal-800 px-3 py-1 text-sm font-semibold" title="Verified check-ins inside now; check-ins awaiting review are shown separately">' +
        '<span class="relative flex h-2.5 w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-60"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-teal-600"></span></span>' +
        (n === null ? '…' : n) + ' inside' + (S.occPending ? '<span class="text-amber-700 font-medium">· ' + S.occPending + ' pending</span>' : '') + '</div>';
    }

    function render() {
      var app = document.getElementById('app');
      if (BOOT.error && !S.init) return renderFatal(BOOT.error);
      if (!S.init.me.registered) return renderRegister();
      if (S.checkin) return renderCheckin();
      var tabs = visibleTabs();
      if (!tabs.length) return renderFatal({ message: 'Your account has no LabPulse role yet. Ask the lab in-charge.' });
      if (!S.tab || !tabs.some(function (t) { return t.id === S.tab; })) S.tab = tabs[0].id;
      S.active = [];
      var tab = tabs.filter(function (t) { return t.id === S.tab; })[0];
      app.innerHTML = header() + '<main class="max-w-7xl mx-auto p-4 space-y-4 pb-24">' + tab.view() + '</main>';
      loadAll();
    }

    function renderFatal(e) {
      document.getElementById('app').innerHTML =
        '<div class="min-h-screen grid place-items-center p-6"><div class="lp-card p-6 max-w-md text-center">' +
        '<div class="text-4xl mb-3">🔒</div><h1 class="text-lg font-bold mb-2">LabPulse</h1>' +
        '<p class="text-slate-600">' + esc(e.message) + '</p>' +
        '<a class="lp-btn lp-btn-primary mt-5" href="' + esc(BOOT.webAppUrl) + '">Reload</a></div></div>';
    }

    /* ================= registration (FR-02) ================= */

    function renderRegister() {
      var me = S.init.me;
      document.getElementById('app').innerHTML =
        '<div class="min-h-screen grid place-items-center p-4"><form id="reg-form" class="lp-card p-6 w-full max-w-md space-y-4">' +
        '<div><h1 class="text-xl font-bold">Welcome to LabPulse</h1><p class="text-sm text-slate-600 mt-1">One-time profile for <b>' + esc(me.email) + '</b>.' +
        (BOOT.claim && BOOT.claim.ok ? ' Your QR scan is held for a few minutes while you finish.' : '') + '</p></div>' +
        field('Full name', input('name', me.name, 'required autocomplete="name"')) +
        field('Roll number / employee ID', input('reg_no', me.reg_no, 'required placeholder="URK24CS1249" autocapitalize="characters"')) +
        field('Mobile number', input('mobile', '', 'required inputmode="tel" placeholder="98765 43210" autocomplete="tel"')) +
        '<div id="reg-error" class="hidden rounded-lg bg-red-50 text-red-800 text-sm p-3"></div>' +
        '<button class="lp-btn lp-btn-primary w-full" id="reg-btn">Save and continue</button>' +
        '<p class="text-xs text-slate-500">Your mobile number is visible only to lab staff and administrators. It never appears in exports.</p>' +
        '</form></div>';
      document.getElementById('reg-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var btn = document.getElementById('reg-btn');
        var err = document.getElementById('reg-error');
        btn.disabled = true;
        err.classList.add('hidden');
        call('register', formData(ev.target)).then(function () {
          return call('bootstrap');
        }).then(function (init) {
          S.init = init;
          afterInit();
        }, function (e) {
          err.textContent = e.message;
          err.classList.remove('hidden');
          btn.disabled = false;
        });
      });
    }

    /* ================= check-in flow (§4.1) ================= */

    function startCheckin(claim) {
      S.checkin = {
        claim: claim,
        expiresAt: Date.now() + (claim.expiresInSec || 300) * 1000,
        step: 'form',
        loc: { state: 'pending' },
        reason: { type: null, sessionId: '', purpose: '', equipment: '', equip: [], manual: false, m_code: '', m_name: '', m_coord: '', m_hours: '',
          systemId: '', projectId: '', newProject: false, np_title: '', np_end: '', np_desc: '' },
        options: null,
        result: null,
        error: null,
        requestId: null
      };
      render();
      startLocation();
      call('checkinOptions', { labId: claim.labId }).then(function (o) {
        S.checkin.options = o;
        if (S.checkin.step === 'form') renderCheckin();
      }, function () {
        S.checkin.options = { courses: [], events: [] };
        if (S.checkin.step === 'form') renderCheckin();
      });
    }

    function startLocation() {
      var c = S.checkin;
      c.loc = { state: 'pending' };
      paintLoc();
      if (!navigator.geolocation) {
        c.loc = { state: 'error', msg: 'This browser cannot share location. Ask lab staff for a supervised entry.' };
        return paintLoc();
      }
      var started = Date.now();
      var watch = navigator.geolocation.watchPosition(function (pos) {
        var acc = pos.coords.accuracy;
        if (!c.loc.best || acc < c.loc.best.accuracy) {
          c.loc.best = {
            lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: acc, ts: pos.timestamp || Date.now(),
            // Only a few browsers expose this; a missing flag proves nothing (§4.2 step 9).
            mock: pos.coords.mocked === true || pos.mocked === true || pos.coords.isMock === true ? true : null
          };
        }
        c.loc.state = 'ok';
        paintLoc();
        if (acc <= 15 || Date.now() - started > 20000) navigator.geolocation.clearWatch(watch);
      }, function (err) {
        if (c.loc.best) return;
        c.loc = err.code === 1
          ? { state: 'denied' }
          : { state: 'error', msg: err.code === 3 ? 'Getting a location fix took too long. Move near a window and retry.' : 'Your phone could not get a location fix. Retry, or ask lab staff.' };
        paintLoc();
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
      setTimeout(function () { navigator.geolocation.clearWatch(watch); }, 30000);
    }

    function locHtml() {
      var l = S.checkin.loc;
      if (l.state === 'pending') return '<div class="flex items-center gap-2 text-slate-600"><span class="lp-spin"></span> Getting your location… allow it when your phone asks.</div>';
      if (l.state === 'ok') {
        var a = Math.round(l.best.accuracy);
        return '<div class="flex items-center gap-2 flex-wrap">' + badge(a <= 30 ? 'green' : 'amber', a <= 30 ? 'Location ready' : 'Weak GPS') +
          '<span class="text-sm text-slate-600">accuracy ±' + a + ' m' + (a > 30 ? ' — you can still check in; it may need review' : '') + '</span></div>';
      }
      if (l.state === 'denied') {
        return '<div class="rounded-lg bg-amber-50 text-amber-900 text-sm p-3 space-y-1"><b>Location is blocked.</b>' +
          '<p>LabPulse needs your location once to confirm you are in the lab. Nothing is saved except whether you were inside.</p>' +
          '<p><b>To allow it:</b> tap the lock or ⓘ icon next to the address → Permissions → Location → Allow. Then tap Retry.</p>' +
          '<p>If you cannot share location, ask lab staff for a supervised manual entry.</p>' +
          '<button type="button" class="lp-btn lp-btn-ghost lp-btn-sm mt-1" data-act="loc-retry">Retry</button></div>';
      }
      return '<div class="rounded-lg bg-red-50 text-red-800 text-sm p-3">' + esc(l.msg) + ' <button type="button" class="underline" data-act="loc-retry">Retry</button></div>';
    }
    function paintLoc() {
      var el = document.getElementById('loc-status');
      if (el) el.innerHTML = locHtml();
      paintSubmit();
    }
    function equipmentText() {
      var r = S.checkin.reason;
      return r.equip.concat(r.equipment.trim() ? [r.equipment.trim()] : []).join(', ');
    }
    function reasonComplete() {
      var r = S.checkin.reason;
      var hours = Number(r.m_hours);
      if ((r.type === 'COURSE' || r.type === 'EVENT') && r.manual) {
        return hours >= 0.5 && (r.type === 'COURSE'
          ? r.m_code.trim().length >= 2 && r.m_name.trim().length >= 3
          : r.m_name.trim().length >= 3 && r.m_coord.trim().length >= 3);
      }
      if (r.type === 'COURSE' || r.type === 'EVENT') return !!r.sessionId;
      if (r.type === 'RESEARCH') {
        var hasProject = r.newProject ? r.np_title.trim().length >= 3 && /^\d{4}-\d{2}-\d{2}$/.test(r.np_end) : !!r.projectId;
        return r.purpose.trim().length >= 5 && equipmentText().length > 0 && hasProject;
      }
      return false;
    }

    function chip(act, id, label, on, extra) {
      return '<button type="button" class="rounded-full border px-3 py-1 text-sm ' + (on ? 'bg-teal-50 border-teal-600 text-teal-800 font-semibold' : 'bg-white border-slate-300') +
        '" aria-pressed="' + on + '" data-act="' + act + '" data-id="' + esc(id) + '">' + (on ? '✓ ' : '') + esc(label) + (extra || '') + '</button>';
    }

    /** Step 3: which system the student works at, and (for extra hours) which project. */
    function workFields() {
      var c = S.checkin;
      var r = c.reason;
      if (!r.type || !c.options) return '';
      var systems = (c.options.systems || []).map(function (s) {
        return chip('ci-system', s.asset_id, s.name, r.systemId === s.asset_id, s.in_use ? ' <span class="text-xs text-amber-700">· in use</span>' : '');
      }).join('') + chip('ci-system', 'OWN', 'Own laptop', r.systemId === 'OWN');
      var html = '<div><span class="lp-label">Which system are you working on? (optional)</span><div class="flex flex-wrap gap-2">' + systems + '</div></div>';
      if (r.type === 'RESEARCH') {
        var projects = (c.options.projects || []).map(function (p) {
          return '<button type="button" class="lp-option" aria-pressed="' + (!r.newProject && r.projectId === p.project_id) + '" data-act="ci-project" data-id="' + esc(p.project_id) + '">' +
            '<div class="font-semibold">' + esc(p.title) + '</div><div class="text-xs text-slate-500">until ' + esc(p.end_date) + '</div></button>';
        }).join('');
        html += '<div class="mt-4"><span class="lp-label">Which project is this time for?</span><div class="grid gap-2">' + projects +
          '<button type="button" class="lp-option" aria-pressed="' + r.newProject + '" data-act="ci-project" data-id="NEW"><div class="font-semibold">+ New project</div><div class="text-xs text-slate-500">Title and timeline; you can add details later</div></button></div>' +
          (r.newProject ? '<div class="space-y-3 mt-3">' +
            field('Project title', '<input class="lp-input" data-bind="np_title" placeholder="e.g. Smart irrigation with ESP32" value="' + esc(r.np_title) + '">') +
            field('Expected end date (timeline)', '<input class="lp-input" type="date" data-bind="np_end" value="' + esc(r.np_end) + '">') +
            field('Short description (optional)', '<textarea class="lp-input" rows="2" data-bind="np_desc">' + esc(r.np_desc) + '</textarea>') + '</div>' : '') + '</div>';
      }
      return html;
    }
    function paintSubmit() {
      var b = document.getElementById('ci-submit');
      if (!b) return;
      var ready = S.checkin.loc.state === 'ok' && reasonComplete();
      b.disabled = !ready;
      var hint = document.getElementById('ci-hint');
      if (hint) {
        hint.textContent = S.checkin.loc.state !== 'ok' ? 'Waiting for your location…' : !S.checkin.reason.type ? 'Choose why you are here.' : !reasonComplete() ? 'Complete the details above.' : '';
      }
    }

    function reasonFields() {
      var c = S.checkin;
      var r = c.reason;
      if (!r.type) return '';
      if (!c.options) return '<div class="mt-3">' + skeleton(48) + '</div>';
      if (r.type === 'RESEARCH') {
        var chips = (c.options.equipment || []).concat(['None']).map(function (t) {
          var on = r.equip.indexOf(t) !== -1;
          return '<button type="button" class="rounded-full border px-3 py-1 text-sm ' + (on ? 'bg-teal-50 border-teal-600 text-teal-800 font-semibold' : 'bg-white border-slate-300') +
            '" aria-pressed="' + on + '" data-act="ci-equip" data-type="' + esc(t) + '">' + (on ? '✓ ' : '') + esc(t) + '</button>';
        }).join('');
        return '<div class="space-y-3 mt-3">' +
          field('Purpose of visit', '<textarea class="lp-input" rows="2" data-bind="purpose" placeholder="e.g. Training a CNN for my final-year project">' + esc(r.purpose) + '</textarea>') +
          '<div><span class="lp-label">Specific hardware / equipment required</span><div class="flex flex-wrap gap-2">' + chips + '</div></div>' +
          field('Other equipment (optional)', '<input class="lp-input" data-bind="equipment" placeholder="anything not listed above" value="' + esc(r.equipment) + '">') + '</div>';
      }
      var isCourse = r.type === 'COURSE';
      var toggle = '<button type="button" class="text-sm text-teal-700 font-semibold mt-3" data-act="ci-manual">' +
        (r.manual ? '← Pick from the timetable instead' : 'My ' + (isCourse ? 'course' : 'event') + ' isn’t listed') + '</button>';
      if (r.manual) {
        return '<div class="space-y-3 mt-3">' +
          (isCourse
            ? field('Course code', '<input class="lp-input" data-bind="m_code" placeholder="23CS2048" autocapitalize="characters" value="' + esc(r.m_code) + '">') +
              field('Course name', '<input class="lp-input" data-bind="m_name" value="' + esc(r.m_name) + '">') +
              field('Session duration (hours)', '<input class="lp-input" data-bind="m_hours" inputmode="decimal" placeholder="2" value="' + esc(r.m_hours) + '">')
            : field('Event name', '<input class="lp-input" data-bind="m_name" value="' + esc(r.m_name) + '">') +
              field('Event coordinator name', '<input class="lp-input" data-bind="m_coord" value="' + esc(r.m_coord) + '">') +
              field('Expected duration (hours)', '<input class="lp-input" data-bind="m_hours" inputmode="decimal" placeholder="3" value="' + esc(r.m_hours) + '">')) +
          '<p class="text-xs text-slate-500">Not in the timetable, so lab staff will confirm it with one tap.</p></div>' + toggle;
      }
      var list = isCourse ? c.options.courses : c.options.events;
      if (!list.length) return '<p class="text-sm text-slate-600 mt-3">No ' + (isCourse ? 'lab course' : 'event') + ' is scheduled in this lab right now.</p>' + toggle;
      return '<div class="space-y-2 mt-3">' + list.map(function (s) {
        var sel = s.id === r.sessionId;
        return '<button type="button" class="lp-option" aria-pressed="' + sel + '" data-act="ci-session" data-id="' + esc(s.id) + '">' +
          '<div class="font-semibold">' + esc((s.code ? s.code + ' · ' : '') + s.name) + '</div>' +
          '<div class="text-xs text-slate-500 mt-0.5">' + esc([s.coordinator, s.start_time && s.end_time ? s.start_time + '–' + s.end_time : '', s.session_hours ? s.session_hours + ' h' : ''].filter(Boolean).join(' · ')) + '</div></button>';
      }).join('') + '</div>' + toggle;
    }

    function renderCheckin() {
      var c = S.checkin;
      var app = document.getElementById('app');
      var shell = function (inner) {
        return '<div class="min-h-screen max-w-md mx-auto p-4 flex flex-col gap-4">' +
          '<div class="flex items-center gap-2 pt-2"><div class="w-8 h-8 rounded-lg bg-teal-700 text-white grid place-items-center font-black">L</div><div class="font-bold">LabPulse</div></div>' + inner + '</div>';
      };
      if (!c.claim.ok) {
        app.innerHTML = shell('<div class="lp-card p-6 text-center"><div class="text-4xl mb-2">⚠️</div><h1 class="text-lg font-bold">Not checked in</h1>' +
          '<p class="text-slate-600 mt-2">' + esc(c.claim.message) + '</p>' +
          '<button class="lp-btn lp-btn-primary mt-5 w-full" data-act="ci-done">Go to my dashboard</button></div>');
        return;
      }
      if (c.step === 'submitting') {
        app.innerHTML = shell('<div class="lp-card p-8 text-center"><div class="flex justify-center mb-3 text-teal-700"><span class="lp-spin" style="width:2rem;height:2rem"></span></div>' +
          '<h1 class="text-lg font-bold">Checking… please wait</h1><p class="text-sm text-slate-500 mt-1">Verifying your scan and location.</p></div>');
        return;
      }
      if (c.step === 'result') return renderCheckinResult(shell);
      var r = c.reason;
      var opt = function (type, title, sub) {
        return '<button type="button" class="lp-option" aria-pressed="' + (r.type === type) + '" data-act="ci-type" data-type="' + type + '">' +
          '<div class="font-semibold">' + title + '</div><div class="text-xs text-slate-500">' + sub + '</div></button>';
      };
      app.innerHTML = shell(
        '<div class="lp-card p-4"><div class="text-xs uppercase tracking-wide text-slate-500 font-semibold">Checking in to</div>' +
        '<div class="text-xl font-bold">' + esc(c.claim.labName) + '</div>' +
        '<div class="text-xs text-slate-500 mt-1">Finish within ' + Math.max(1, Math.round((c.expiresAt - Date.now()) / 60000)) + ' minutes, or scan again.</div></div>' +
        '<div class="lp-card p-4"><div class="text-sm font-semibold mb-2">1 · Location</div><div id="loc-status">' + locHtml() + '</div></div>' +
        '<div class="lp-card p-4"><div class="text-sm font-semibold mb-2">2 · Why are you here?</div><div class="grid gap-2">' +
        opt('COURSE', 'Regular lab course', 'Course code, name and session hours fill in from the timetable') +
        opt('EVENT', 'Event / workshop', 'Event name, coordinator and expected duration') +
        opt('RESEARCH', 'Individual research / extra hours', 'Your project, today’s purpose and the equipment you need') +
        '</div><div id="ci-fields">' + reasonFields() + '</div></div>' +
        (r.type ? '<div class="lp-card p-4"><div class="text-sm font-semibold mb-2">3 · What are you working on?</div>' + workFields() + '</div>' : '') +
        (c.error ? '<div class="rounded-lg bg-red-50 text-red-800 text-sm p-3">' + esc(c.error.message) + '</div>' : '') +
        '<div class="sticky bottom-0 bg-slate-100 pt-2 pb-4"><button class="lp-btn lp-btn-primary w-full !py-3 text-base" id="ci-submit" data-act="ci-submit" disabled>Check in</button>' +
        '<p id="ci-hint" class="text-center text-xs text-slate-500 mt-2"></p></div>'
      );
      paintSubmit();
    }

    function renderCheckinResult(shell) {
      var res = S.checkin.result;
      var o = res.outcome;
      var v = res.visit;
      var head = o === 'GREEN' ? ['✅', 'Checked in', 'bg-green-50 text-green-900']
        : o === 'AMBER' ? ['🟡', 'Checked in — pending review', 'bg-amber-50 text-amber-900']
        : o === 'EXISTING' ? ['ℹ️', 'You are already checked in', 'bg-blue-50 text-blue-900']
        : ['⛔', 'Not checked in', 'bg-red-50 text-red-900'];
      var why = (res.reasons || []).length ? '<ul class="text-sm mt-3 text-left list-disc pl-5 space-y-1">' + res.reasons.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '';
      var note = o === 'AMBER' ? '<p class="text-sm mt-3">You count as inside. Your ' + (v && v.entry_type === 'RESEARCH' ? 'lab staff' : 'faculty') + ' will confirm with one tap.</p>'
        : o === 'RED' ? '<p class="text-sm mt-3">If you are in the lab, move closer to the centre of the room and scan the QR again, or ask lab staff.</p>' : '';
      document.getElementById('app').innerHTML = shell(
        '<div class="rounded-2xl p-6 text-center ' + head[2] + '"><div class="text-5xl mb-2">' + head[0] + '</div><h1 class="text-xl font-bold">' + head[1] + '</h1>' +
        (v ? '<p class="mt-2 font-medium">' + esc(v.lab_name) + '</p><p class="text-sm">' + esc(v.label) + ' · since ' + fmtTime(v.check_in_at) + '</p>' : '') +
        why + note + '</div>' +
        '<button class="lp-btn lp-btn-primary w-full !py-3" data-act="ci-done">Go to my dashboard</button>');
    }

    function submitCheckin() {
      var c = S.checkin;
      if (!c.loc.best || !reasonComplete()) return;
      var r0 = c.reason;
      if (r0.type === 'RESEARCH' && r0.newProject) {
        c.step = 'submitting';
        renderCheckin();
        return call('projectSave', { lab_id: c.claim.labId, title: r0.np_title, end_date: r0.np_end, description: r0.np_desc }).then(function (p) {
          r0.projectId = p.project_id;
          r0.newProject = false;
          c.options.projects = (c.options.projects || []).concat([{ project_id: p.project_id, title: p.title, end_date: p.end_date }]);
          c.step = 'form';
          submitCheckin();
        }, function (e) {
          c.step = 'form';
          c.error = e;
          renderCheckin();
        });
      }
      c.requestId = c.requestId || rid();
      var b = c.loc.best;
      var r = c.reason;
      var payload = {
        labId: c.claim.labId, lat: b.lat, lng: b.lng, accuracy: b.accuracy, mock: b.mock, posAgeMs: Date.now() - b.ts,
        requestId: c.requestId,
        reason: Object.assign(r.type === 'RESEARCH' ? { type: r.type, purpose: r.purpose, equipment: equipmentText(), projectId: r.projectId }
          : r.manual ? { type: r.type, manual: r.type === 'COURSE'
            ? { code: r.m_code, name: r.m_name, hours: Number(r.m_hours) }
            : { event_name: r.m_name, coordinator: r.m_coord, hours: Number(r.m_hours) } }
          : { type: r.type, sessionId: r.sessionId }, { systemId: r.systemId })
      };
      c.step = 'submitting';
      c.error = null;
      renderCheckin();
      var attempt = 0;
      (function tryOnce() {
        call('checkIn', payload).then(function (res) {
          c.result = res;
          c.step = 'result';
          renderCheckin();
        }, function (e) {
          // A network drop is retried with the same request ID, so it can never create a second visit.
          if (e.code === 'NETWORK' && attempt++ < 2) return sleep(1500).then(tryOnce);
          c.step = 'form';
          c.error = e;
          if (e.code !== 'NETWORK') c.requestId = null;
          renderCheckin();
        });
      })();
    }

    /* ================= student ================= */

    function studentLab() { return S.status && S.status.visit ? S.status.visit.lab_id : S.lab; }

    function viewHome() {
      return section('status', { live: true, height: 120, load: function () { return call('status'); }, html: htmlStatus }) +
        '<div class="grid md:grid-cols-2 gap-4">' +
        section('free', { live: true, load: function () { return call('freeNow', { labId: studentLab() }); }, html: htmlFree }) +
        section('myitems', { live: true, load: function () { return call('myItems'); }, html: htmlMyItems }) +
        '</div>' +
        section('map', { live: true, height: 160, load: function () { return call('labMap', { labId: studentLab() }); }, html: htmlMap }) +
        section('myhours', { load: function () { return call('myHours'); }, html: function (h) {
          var tile = function (label, v) { return '<div><div class="text-xs text-slate-500 font-semibold">' + label + '</div><div class="text-2xl font-bold text-teal-800">' + v + '</div></div>'; };
          return card('My lab time', '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">' + tile('Total hours', h.total_hours) + tile('Days in lab', h.total_days) +
            tile('This week (h)', h.week_hours) + tile('Last visit', h.last_visit || '—') + '</div>');
        } }) +
        section('mybookings', { live: true, load: function () { return call('myBookings'); }, html: htmlMyBookings }) +
        section('recent', { load: function () { return call('myHistory'); }, html: function (d) { return card('Recent visits', htmlVisits(d.slice(0, 5))); } });
    }

    function htmlStatus(st) {
      var changed = !S.status || !!S.status.checkedIn !== !!st.checkedIn;
      S.status = st;
      if (changed) setTimeout(function () { paintSection('free'); }, 0);
      var body;
      if (st.checkedIn) {
        var v = st.visit;
        body = '<div class="flex items-start justify-between gap-3 flex-wrap"><div>' +
          '<div class="flex items-center gap-2 flex-wrap"><span class="text-xl font-bold text-teal-800">Checked in · ' + dur(v.duration_ms) + '</span>' + visitBadge(v) + '</div>' +
          '<div class="text-slate-600 mt-1">' + esc(v.lab_name) + ' · ' + esc(v.label) + '</div>' +
          '<div class="text-xs text-slate-500 mt-1">Since ' + fmtTime(v.check_in_at) + (v.expected_end_at ? ' · closes automatically at ' + fmtTime(v.expected_end_at) + ' if you forget' : '') + '</div>' +
          (v.review_status === 'PENDING' ? '<div class="text-xs text-amber-800 mt-2">Your check-in is waiting for a one-tap review. You count as inside meanwhile.</div>' : '') +
          '</div><button class="lp-btn lp-btn-primary" data-act="checkout">Check out</button></div>';
      } else if (st.ticket) {
        body = '<div class="flex items-center justify-between gap-3 flex-wrap"><div><div class="text-xl font-bold">Scan received</div>' +
          '<div class="text-slate-600 text-sm">Finish checking in to ' + esc(st.ticket.labName) + ' within ' + Math.max(1, Math.round(st.ticket.expiresInSec / 60)) + ' min.</div></div>' +
          '<button class="lp-btn lp-btn-primary" data-act="resume-checkin" data-lab="' + esc(st.ticket.labId) + '" data-name="' + esc(st.ticket.labName) + '" data-exp="' + st.ticket.expiresInSec + '">Continue check-in</button></div>';
      } else {
        body = '<div class="flex items-center justify-between gap-3 flex-wrap"><div><div class="text-xl font-bold">Not checked in</div>' +
          '<div class="text-slate-600 text-sm">Scan the QR on the lab monitor with your phone camera.</div></div>' +
          '<button class="lp-btn lp-btn-primary" data-act="scan-help">Scan</button></div>';
      }
      return '<section class="lp-card p-5">' + body + '</section>';
    }

    function htmlFree(list) {
      var inLab = S.status && S.status.checkedIn && S.status.visit.review_status !== 'PENDING';
      var pendingNote = S.status && S.status.checkedIn && !inLab;
      var chips = list.length ? '<div class="flex flex-wrap gap-2">' + list.map(function (x) {
        return '<span class="rounded-full bg-green-50 text-green-800 border border-green-200 px-3 py-1 text-sm font-semibold">' + x.count + ' ' + esc(x.type) + '</span>';
      }).join('') + '</div>' : empty('Nothing is free right now.');
      return card('Free right now', chips +
        '<div class="mt-4 flex items-center gap-3 flex-wrap"><button class="lp-btn lp-btn-primary" data-act="request-asset"' + (inLab && list.length ? '' : ' disabled') + '>Request equipment</button>' +
        (inLab ? '' : '<span class="text-xs text-slate-500">' + (pendingNote ? 'You can request equipment once your check-in is confirmed.' : 'You can request equipment while you are checked in to the lab.') + '</span>') + '</div>');
    }

    function bookingBadge(b) {
      return {
        BOOKED: badge('green', 'Confirmed'), WAITLIST: badge('amber', 'Waitlist #' + b.position), IN_USE: badge('blue', 'In use'),
        DONE: badge('gray', 'Done'), CANCELLED: badge('gray', 'Cancelled'), NO_SHOW: badge('red', 'No-show'), EXPIRED: badge('gray', 'Expired')
      }[b.status] || badge('gray', b.status);
    }
    function slotText(b) { return fmtDT(b.start_at) + '–' + fmtTime(b.end_at); }

    function htmlMyBookings(list) {
      var rows = list.map(function (b) {
        var open = b.status === 'BOOKED' || b.status === 'WAITLIST';
        return '<li class="flex items-center justify-between gap-2 py-2"><div><div class="font-medium">' + esc(b.asset_name) + '</div>' +
          '<div class="text-xs text-slate-500">' + esc(slotText(b)) + ' · ' + esc(b.purpose || '') + '</div>' +
          (b.status === 'WAITLIST' ? '<div class="text-xs text-amber-800">You are number ' + b.position + ' in the queue. We email you if the slot frees up.</div>' : '') +
          (b.status === 'BOOKED' ? '<div class="text-xs text-teal-800">Check in to the lab at that time; lab staff start your session.</div>' : '') + '</div>' +
          '<div class="flex items-center gap-2">' + bookingBadge(b) + (open ? '<button class="lp-btn lp-btn-ghost lp-btn-sm" data-act="booking-cancel" data-id="' + esc(b.booking_id) + '">Cancel</button>' : '') + '</div></li>';
      });
      return card('My reservations', (rows.length ? '<ul class="divide-y divide-slate-100">' + rows.join('') + '</ul>' : empty('No reservations. Reserve a 3D printer, drone or GPU node for a time slot.')),
        can('bookAsset') ? '<button class="lp-btn lp-btn-primary lp-btn-sm" data-act="booking-new">Reserve a slot</button>' : '');
    }

    function htmlBookingsToday(list) {
      var act = can('startBooking');
      return card('Today’s reservations', list.length ? '<ul class="space-y-2">' + list.map(function (b) {
        return '<li class="rounded-lg bg-slate-50 p-3 text-sm"><div class="flex justify-between gap-2"><b>' + esc(b.asset_name) + '</b>' + bookingBadge(b) + '</div>' +
          '<div class="text-xs text-slate-600">' + esc(fmtTime(b.start_at) + '–' + fmtTime(b.end_at)) + ' · ' + esc(b.user_name) + ' · ' + esc(b.reg_no) +
          (b.status === 'BOOKED' ? (b.checked_in ? ' · ' + 'in the lab' : ' · not checked in yet') : '') + '</div>' +
          '<div class="text-xs text-slate-500">' + esc(b.purpose || '') + '</div>' +
          (act && b.status === 'BOOKED' ? '<button class="lp-btn lp-btn-primary lp-btn-sm mt-2" data-act="booking-start" data-id="' + esc(b.booking_id) + '"' + (b.checked_in ? '' : ' disabled title="The student must check in first"') + '>Start session</button>' : '') +
          (act && b.status === 'IN_USE' ? '<button class="lp-btn lp-btn-ghost lp-btn-sm mt-2" data-act="booking-finish" data-id="' + esc(b.booking_id) + '" data-name="' + esc(b.asset_name) + '">Finish session</button>' : '') + '</li>';
      }).join('') + '</ul>' : empty('No reservations today.'));
    }

    function htmlMyItems(d) {
      var open = d.loans.filter(function (l) { return l.status !== 'RETURNED'; });
      var pending = d.requests.filter(function (r) { return r.status === 'PENDING'; });
      var rows = open.map(function (l) {
        return '<li class="flex items-center justify-between gap-2 py-2"><div><div class="font-medium">' + esc(l.asset_name) + '</div><div class="text-xs text-slate-500">Due ' + fmtDT(l.due_at) + '</div></div>' +
          (l.overdue ? badge('red', 'Overdue') : badge('blue', 'Borrowed')) + '</li>';
      }).concat(pending.map(function (r) {
        return '<li class="flex items-center justify-between gap-2 py-2"><div><div class="font-medium">' + esc(r.asset_name) + '</div><div class="text-xs text-slate-500">Requested ' + fmtTime(r.created_at) + ' · collect from lab staff</div></div>' +
          '<div class="flex items-center gap-2">' + badge('amber', 'Requested') + '<button class="lp-btn lp-btn-ghost lp-btn-sm" data-act="cancel-request" data-id="' + esc(r.request_id) + '">Cancel</button></div></li>';
      }));
      return card('My items', rows.length ? '<ul class="divide-y divide-slate-100">' + rows.join('') + '</ul>' : empty('You have nothing borrowed.'),
        '<button class="text-sm text-teal-700 font-semibold" data-act="tab" data-tab="history">Full history</button>');
    }

    function htmlMap(m) {
      var grid = [];
      for (var y = 0; y < m.rows; y++) for (var x = 0; x < m.cols; x++) grid.push(null);
      m.cells.forEach(function (c) { if (c.map_y < m.rows && c.map_x < m.cols) grid[c.map_y * m.cols + c.map_x] = c; });
      var color = { AVAILABLE: 'lp-green', RESERVED: 'lp-amber', ISSUED: 'lp-blue', IN_USE: 'lp-blue', UNAVAILABLE: 'lp-gray' };
      var cells = grid.map(function (c) {
        if (!c) return '<div class="lp-cell"></div>';
        return '<div class="lp-cell has ' + (color[c.status] || 'lp-gray') + '" title="' + esc(c.name + ' — ' + c.status) + '">' + esc(c.asset_id) + '</div>';
      }).join('');
      var legend = '<div class="flex flex-wrap gap-2 mt-3">' + badge('green', 'Available') + badge('amber', 'Reserved') + badge('blue', 'Issued / in use') + badge('gray', 'Unavailable') + '</div>';
      return card('Live lab map', '<div class="lp-map" style="grid-template-columns:repeat(' + m.cols + ',minmax(0,1fr))">' + cells + '</div>' + legend +
        '<p class="text-xs text-slate-500 mt-2">' + esc(m.note) + '</p>', '<span class="text-xs text-slate-500">' + m.occupancy + ' people inside</span>');

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-act]');
      if (!el) return;
      var fn = ACTIONS[el.getAttribute('data-act')];
      if (!fn) return;
      if (el.tagName === 'BUTTON' && el.type !== 'submit') ev.preventDefault();
      fn(el.dataset, el, ev);
    });

    document.addEventListener('input', function (ev) {
      var bind = ev.target.getAttribute('data-bind');
      if (bind && S.checkin) {
        S.checkin.reason[bind] = ev.target.value;
        paintSubmit();
      }
    });

    /** In the reserve form: show what is already booked for the chosen item and day. */
    function showSchedule() {
      var f = document.getElementById('modal-form');
      var info = document.getElementById('slot-info');
      if (!f || !info) return;
      var asset = f.querySelector('[name=assetId]').value;
      var date = f.querySelector('[name=date]').value;
      if (!asset || !date) return;
      info.textContent = 'Checking the schedule…';
      call('assetSchedule', { assetId: asset, date: date }).then(function (list) {
        info.innerHTML = list.length ? 'Already reserved that day: ' + list.map(function (b) {
          return '<b>' + esc(fmtTime(b.start_at) + '–' + fmtTime(b.end_at)) + '</b>' + (b.mine ? ' (you)' : '') + (b.status === 'WAITLIST' ? ' (queue)' : '');
        }).join(', ') : 'Free all day.';
      }, function () { info.textContent = ''; });
    }

    document.addEventListener('change', function (ev) {
      var t = ev.target;
      if (t.hasAttribute('data-schedule')) return showSchedule();
      if (t.id === 'lab-select') {
        S.lab = t.value;
        S.roster.sessionId = null;
        S.occ = null;
        render();
        refreshOcc();
      } else if (t.id === 'roster-date') {
        S.roster.date = t.value;
        loadSection('roster');
      } else if (t.hasAttribute('data-user-role') || t.hasAttribute('data-user-active')) {
        var email = t.getAttribute('data-user-role') || t.getAttribute('data-user-active');
        var row = t.closest('tr');
        var roleSel = row.querySelector('[data-user-role]');
        var active = row.querySelector('[data-user-active]');
        call('saveUser', { email: email, role: roleSel.value, active: active.checked }).then(function () { toast('Updated ' + email + '.'); }, function (e) { toast(e.message, 'error'); loadSection('people'); });
      }
    });

    document.addEventListener('submit', function (ev) {
      var f = ev.target;
      if (f.id === 'lab-form') {
        ev.preventDefault();
        call('saveLab', formData(f)).then(function (lab) {
          toast('Lab settings saved.');
          S.lab = lab.lab_id;
          return call('bootstrap').then(function (init) { S.init = init; render(); });
        }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'global-form') {
        ev.preventDefault();
        call('saveGlobal', formData(f)).then(function () { toast('System settings saved.'); }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'perm-form') {
        ev.preventDefault();
        var overrides = {};
        Array.prototype.forEach.call(f.querySelectorAll('input[type=checkbox]:checked:not(:disabled)'), function (cb) {
          var p = cb.name.split('|');
          (overrides[p[0]] = overrides[p[0]] || []).push(p[1]);
        });
        call('savePermissions', { overrides: overrides }).then(function () { toast('Permissions saved.'); }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'lookup-student') {
        ev.preventDefault();
        var qv = f.querySelector('[name=q]').value;
        S.lookupQ = qv;
        var out1 = document.getElementById('lookup-student-out');
        out1.innerHTML = skeleton(120);
        call('lookupStudent', { q: qv }).then(function (r) { out1.innerHTML = htmlStudentLookup(r); }, function (e) { out1.innerHTML = errorBox(e); });
      } else if (f.id === 'lookup-asset') {
        ev.preventDefault();
        var av = f.querySelector('[name=assetId]').value;
        S.lookupAsset = av;
        var out2 = document.getElementById('lookup-asset-out');
        out2.innerHTML = skeleton(120);
        call('lookupAsset', { assetId: av }).then(function (r) { out2.innerHTML = htmlAssetLookup(r); }, function (e) { out2.innerHTML = errorBox(e); });
      } else if (f.id === 'student-add') {
        ev.preventDefault();
        call('manageStudent', formData(f)).then(function () { toast('Student added.'); loadSection('students'); }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'user-add') {
        ev.preventDefault();
        call('saveUser', formData(f)).then(function () { toast('Saved.'); loadSection('people'); }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'audit-form') {
        ev.preventDefault();
        S.auditFilter = formData(f);
        render();
      }
    });

    /* ================= live refresh (FR-14) ================= */

    function paintOcc() {
      var el = document.getElementById('occ-pill');
      if (el) el.innerHTML = occPill();
    }
    function refreshOcc() {
      var lab = role() === 'STUDENT' ? studentLab() : S.lab;
      if (!lab) return;
      call('occupancy', { labId: lab }).then(function (r) { S.occ = r.occupancy; S.occPending = r.pending; paintOcc(); }, function () {});
    }
    function tick() {
      if (document.hidden || S.checkin || !S.init || !S.init.me.registered) return;
      refreshOcc();
      S.active.forEach(function (id) {
        if (S.sections[id] && S.sections[id].live) loadSection(id);
      });
    }

    function afterInit() {
      S.lab = S.lab || (S.init.labs[0] && S.init.labs[0].lab_id) || null;
      if (BOOT.view === 'checkin' && BOOT.claim && S.init.me.registered && !S._claimShown) {
        S._claimShown = true;
        startCheckin(BOOT.claim);
      } else {
        render();
      }
      refreshOcc();
    }

    if (BOOT.error || !S.init) {
      renderFatal(BOOT.error || { message: 'LabPulse could not start.' });
    } else {
      afterInit();
      setInterval(tick, Math.max(5000, Math.min(10000, S.init.pollMs || 8000)));
      document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    }
  })();
