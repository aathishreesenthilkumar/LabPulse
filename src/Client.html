<script>
  /**
   * LabPulse single-page client. The browser only displays data and reports what the phone
   * observed; every decision is made on the server (SRS §3.2).
   */
  (function () {
    'use strict';

    var BOOT = window.BOOT || {};
    var S = {
      init: BOOT.init || null,
      lab: null,
      tab: null,
      status: null,
      occ: null,
      checkin: null,
      sections: {},
      active: [],
      roster: { sessionId: null, date: null },
      report: { kind: 'daily' },
      page: BOOT.view === 'monitor' ? 'app' : BOOT.view || 'landing'
    };

    /* ================= helpers ================= */

    function esc(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function can(a) { return !!(S.init && S.init.allowed.indexOf(a) !== -1); }
    function role() { return S.init && S.init.me ? S.init.me.role : null; }
    function rid() {
      return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    var TZ = { timeZone: 'Asia/Kolkata' };
    function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString('en-IN', Object.assign({ hour: '2-digit', minute: '2-digit' }, TZ)) : ''; }
    function fmtDT(iso) { return iso ? new Date(iso).toLocaleString('en-IN', Object.assign({ day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }, TZ)) : ''; }
    function dur(ms) {
      var m = Math.max(0, Math.floor(ms / 60000));
      return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm';
    }
    function todayKey() { return new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10); }
    function monthKey() { return todayKey().slice(0, 7); }
    function toLocalInput(iso) {
      var d = new Date(new Date(iso).getTime() + 330 * 60000);
      return d.toISOString().slice(0, 16);
    }
    function fromLocalInput(v) { return v ? new Date(v + ':00+05:30').toISOString() : ''; }

    /** google.script.run as a promise. Server replies {ok, data} or {ok:false, code, message}. */
    function call(action, payload) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (r) {
            if (r && r.ok) resolve(r.data);
            else reject(r || { code: 'SERVER', message: 'Unexpected response from the server.' });
          })
          .withFailureHandler(function (e) {
            reject({ code: 'NETWORK', message: (e && e.message) || 'Network problem. Check your connection.' });
          })
          .api(action, payload || {});
      });
    }

    function toast(msg, kind) {
      var root = document.getElementById('toast-root');
      var el = document.createElement('div');
      var cls = kind === 'error' ? 'bg-red-700' : kind === 'warn' ? 'bg-amber-600' : 'bg-slate-900';
      el.className = cls + ' text-white text-sm font-medium px-4 py-3 rounded-xl shadow-xl max-w-md pointer-events-auto';
      el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(function () { el.remove(); }, kind === 'error' ? 6000 : 3500);
    }

    function badge(color, text) { return '<span class="lp-badge lp-' + color + '">' + esc(text) + '</span>'; }

    /** Status colours are always paired with a word (NFR ease of use). */
    function visitBadge(v) {
      if (!v) return '';
      if (v.status === 'VOIDED' || v.review_status === 'DECLINED') return badge('red', 'Declined');
      if (v.review_status === 'PENDING') return badge('amber', 'Pending review');
      if (v.confidence === 'MANUAL') return badge('blue', 'Manual entry');
      if (v.review_status === 'CONFIRMED') return badge('green', 'Confirmed');
      if (v.confidence === 'GREEN') return badge('green', 'Verified');
      return badge('gray', v.confidence || '—');
    }
    function assetBadge(s) {
      var m = { IN_USE: ['blue', 'In use'], AVAILABLE: ['green', 'Available'], RESERVED: ['amber', 'Reserved'], ISSUED: ['blue', 'Issued'], UNAVAILABLE: ['gray', 'Unavailable'], MAINTENANCE: ['gray', 'Maintenance'], RETIRED: ['gray', 'Retired'] }[s] || ['gray', s];
      return badge(m[0], m[1]);
    }
    function closeLabel(t) {
      return { MANUAL: 'Checked out', AUTO_DURATION: 'Auto-closed (session ended)', AUTO_CLOSING: 'Auto-closed (lab closed)', AUTO_SWITCH: 'Closed (moved to another lab)', STAFF: 'Closed by staff', LEFT_DURING_SESSION: 'Left during session', VOIDED: 'Voided' }[t] || '';
    }
    function entryLabel(t) { return { COURSE: 'Lab course', EVENT: 'Event / workshop', RESEARCH: 'Individual research' }[t] || t; }

    /* ---------- icons (inline SVG, stroke style) ---------- */
    var ICON_PATHS = {
      home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
      activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
      calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
      box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
      cpu: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
      check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
      book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/>',
      folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      chart: '<path d="M3 3v18h18"/><path d="M8 16v-5M13 16V8M18 16v-8"/>',
      sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
      shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
      clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
      qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM17 17h4v4h-4z"/>',
      menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
      alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
      inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
      map: '<path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16M16 6v16"/>',
      monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
      lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      pulse: '<path d="M3 12h4l2-6 4 12 2-6h6"/>',
      history: '<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>'
    };
    function icon(name, cls) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' +
        (cls ? ' class="' + cls + '"' : '') + '>' + (ICON_PATHS[name] || '') + '</svg>';
    }

    function errorBox(e) {
      var denied = e && (e.code === 'FORBIDDEN' || e.code === 'NOT_REGISTERED' || e.code === 'INACTIVE');
      return '<div class="lp-card"><div class="lp-card-body flex items-start gap-3 text-sm ' + (denied ? 'text-slate-600' : 'text-red-800') + '">' +
        '<span class="mt-0.5 ' + (denied ? 'text-slate-400' : 'text-red-500') + '">' + icon(denied ? 'lock' : 'alert', 'w-5 h-5') + '</span><div>' +
        (denied ? '<b>Not available for your role.</b> ' : '<b>Could not load.</b> ') + esc(e && e.message) +
        (denied ? '' : ' <button class="underline ml-1 font-semibold" data-act="reload-sections">Retry</button>') + '</div></div></div>';
    }
    function empty(text, ic) { return '<div class="lp-empty">' + icon(ic || 'inbox') + '<span>' + esc(text) + '</span></div>'; }
    function skeleton(h) { return '<div class="lp-skeleton" style="height:' + (h || 88) + 'px"></div>'; }
    /** A titled panel. `extra` sits at the right of the header (buttons, badges). */
    function card(title, body, extra, opts) {
      opts = opts || {};
      return '<section class="lp-card">' + (title ? '<div class="lp-card-head"><h2 class="lp-card-title">' + (opts.icon ? '<span class="text-slate-400">' + icon(opts.icon, 'w-4 h-4') + '</span>' : '') + title + '</h2>' +
        (extra ? '<div class="flex items-center gap-2 flex-wrap justify-end">' + extra + '</div>' : '') + '</div>' : '') +
        '<div class="lp-card-body">' + body + '</div></section>';
    }
    function table(cols, rows) {
      return '<div class="lp-scroll"><table class="lp-table"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
        '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    }
    /** KPI tile: label, a big value (HTML), optional icon/tone/sub-line; `tab` makes it a link to that page. */
    function statTile(label, value, o) {
      o = o || {};
      return '<div class="lp-stat"' + (o.tab ? ' data-act="tab" data-tab="' + o.tab + '" role="button"' : '') + '>' +

        '<div class="min-w-0"><div class="lp-stat-label">' + esc(label) + '</div><div class="lp-stat-value">' + value + '</div>' +
        (o.sub ? '<div class="lp-stat-sub">' + o.sub + '</div>' : '') + '</div></div>';
    }
    function initials(name) {
      return String(name || '?').split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('');
    }

    /**
     * Single-series column chart of people present per hour (one hue, so no legend; the card
     * title names it). Values are labelled on the busiest hours only; every column shows its
     * value on hover; the same numbers are in the table beside it.
     */
    function hourChart(hours) {
      if (!hours || !hours.length) return empty('No attendance recorded for this day.', 'chart');
      // Drawn at roughly the width it will occupy, so axis text stays ~11px on any screen.
      var vw = window.innerWidth || 1024;
      var W = Math.round(Math.max(320, Math.min(1180, vw - (vw >= 1024 ? 330 : 64)))), H = 230, L = 34, R = 8, T = 18, B = 26;
      var iw = W - L - R, ih = H - T - B;
      var max = Math.max.apply(null, hours.map(function (h) { return h.people; }));
      var step = max <= 5 ? 1 : Math.ceil(max / 4 / Math.pow(10, Math.floor(Math.log10(max / 4)))) * Math.pow(10, Math.floor(Math.log10(max / 4)));
      var top = Math.max(1, Math.ceil(max / step) * step);
      var band = iw / hours.length;
      var bw = Math.max(4, Math.min(24, band * 0.62));
      var y = function (v) { return T + ih - (v / top) * ih; };
      var out = '<svg class="lp-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="People present per hour">';
      for (var t = 0; t <= top; t += step) {
        out += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
          '<text class="axis" x="' + (L - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + t + '</text>';
      }
      hours.forEach(function (h, i) {
        var cx = L + band * i + band / 2;
        var x = cx - bw / 2;
        var bh = (h.people / top) * ih;
        var tip = String(h.hour).padStart(2, '0') + ':00–' + String(h.hour + 1).padStart(2, '0') + ':00 · ' + h.people + ' present · up to ' + h.peak + ' at once';
        out += '<rect class="hit" x="' + (L + band * i) + '" y="' + T + '" width="' + band + '" height="' + ih + '" fill="transparent" data-tip="' + esc(tip) + '"/>';
        if (bh > 0) {
          var r = Math.min(4, bw / 2, bh);
          var yy = T + ih - bh;
          out += '<path class="bar" pointer-events="none" d="M' + x + ',' + (T + ih) + 'V' + (yy + r) + 'Q' + x + ',' + yy + ' ' + (x + r) + ',' + yy + 'H' + (x + bw - r) +
            'Q' + (x + bw) + ',' + yy + ' ' + (x + bw) + ',' + (yy + r) + 'V' + (T + ih) + 'Z"/>';
          if (h.people === max) out += '<text class="val" x="' + cx + '" y="' + (yy - 5) + '" text-anchor="middle">' + h.people + '</text>';
        }
        if (hours.length <= 14 || h.hour % 2 === 0) out += '<text class="axis" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + String(h.hour).padStart(2, '0') + '</text>';
      });
      return out + '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ih) + '" y2="' + (T + ih) + '" stroke="#cbd5e1"/></svg>';
    }

    function field(label, inner) { return '<label class="block"><span class="lp-label">' + esc(label) + '</span>' + inner + '</label>'; }
    function input(name, value, attrs) { return '<input class="lp-input" name="' + name + '" value="' + esc(value === undefined || value === null ? '' : value) + '" ' + (attrs || '') + '>'; }
    function select(name, options, value, attrs) {
      return '<select class="lp-input" name="' + name + '" ' + (attrs || '') + '>' + options.map(function (o) {
        var v = Array.isArray(o) ? o[0] : o;
        var t = Array.isArray(o) ? o[1] : o;
        return '<option value="' + esc(v) + '"' + (String(v) === String(value) ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select>';
    }
    function formData(form) {
      var o = {};
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.name) return;
        if (el.type === 'checkbox') o[el.name] = el.checked;
        else o[el.name] = el.value;
      });
      return o;
    }
    function download(filename, text, type) {
      var blob = new Blob([text], { type: type || 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    function labOptions() { return (S.init.labs || []).map(function (l) { return [l.lab_id, l.name]; }); }
    function curLab() {
      var labs = S.init.labs || [];
      return labs.filter(function (l) { return l.lab_id === S.lab; })[0] || labs[0] || null;
    }

    /* ================= sections (independently loaded regions) ================= */

    function section(id, def) {
      S.sections[id] = def;
      S.active.push(id);
      return '<div id="sec-' + id + '">' + (def.data !== undefined && def.keep ? def.html(def.data) : skeleton(def.height)) + '</div>';
    }
    function loadSection(id) {
      var d = S.sections[id];
      if (!d) return Promise.resolve();
      return d.load().then(function (data) {
        d.data = data;
        d.error = null;
      }, function (e) {
        d.error = e;
      }).then(function () { paintSection(id); });
    }
    function paintSection(id) {
      var d = S.sections[id];
      var el = document.getElementById('sec-' + id);
      if (!d || !el) return;
      el.innerHTML = d.error ? errorBox(d.error) : d.html(d.data);
    }
    function loadAll() { S.active.forEach(loadSection); }

    /* ================= modal ================= */

    function openModal(title, body, onSubmit, submitLabel) {
      var root = document.getElementById('modal-root');
      root.innerHTML =
        '<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" data-act="modal-backdrop">' +
        '<form class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92vh] overflow-y-auto" id="modal-form" role="dialog" aria-modal="true">' +
        '<div class="flex items-start justify-between gap-3 px-5 pt-5 pb-3 border-b border-slate-100"><h3 class="font-semibold text-lg tracking-tight">' + esc(title) + '</h3>' +
        '<button type="button" class="text-slate-400 hover:text-slate-700 text-2xl leading-none" data-act="modal-close" aria-label="Close">&times;</button></div>' +
        '<div class="space-y-3 px-5 py-4">' + body + '</div>' +
        '<div id="modal-error" class="hidden mx-5 mb-3 rounded-lg bg-red-50 text-red-800 text-sm p-3"></div>' +
        (onSubmit ? '<div class="flex justify-end gap-2 px-5 py-4 border-t border-slate-100 bg-slate-50/60 rounded-b-2xl"><button type="button" class="lp-btn lp-btn-ghost" data-act="modal-close">Cancel</button>' +
          '<button class="lp-btn lp-btn-primary" id="modal-submit">' + esc(submitLabel || 'Save') + '</button></div>' : '') +
        '</form></div>';
      var form = document.getElementById('modal-form');
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!onSubmit) return;
        var btn = document.getElementById('modal-submit');
        var err = document.getElementById('modal-error');
        btn.disabled = true;
        btn.innerHTML = '<span class="lp-spin"></span> Working…';
        err.classList.add('hidden');
        Promise.resolve(onSubmit(formData(form), form)).then(function (keepOpen) {
          if (!keepOpen) closeModal();
        }, function (e) {
          err.textContent = e && e.message ? e.message : 'Something went wrong.';
          err.classList.remove('hidden');
        }).then(function () {
          if (document.getElementById('modal-submit')) {
            btn.disabled = false;
            btn.textContent = submitLabel || 'Save';
          }
        });
      });
      var first = form.querySelector('input,select,textarea');
      if (first) first.focus();
    }
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    /* ================= shell ================= */

    var ROLE_NAMES = { STUDENT: 'Student', FACULTY: 'Faculty', STAFF: 'Lab staff', COORDINATOR: 'Lab coordinator', HOD: 'HOD', SUPER_ADMIN: 'Super Admin' };
    var ROLE_OPTIONS = ['STUDENT', 'FACULTY', 'STAFF', 'COORDINATOR', 'HOD', 'SUPER_ADMIN'].map(function (r) { return [r, ROLE_NAMES[r]]; });

    var TABS = [
      { id: 'home', label: 'Home', icon: 'home', group: 'Workspace', sub: 'Your status, equipment and time in the lab', show: function () { return role() === 'STUDENT'; }, view: viewHome },
      { id: 'equipment', label: 'Equipment', icon: 'cpu', group: 'Workspace', sub: 'What the lab has and what is free right now', show: function () { return role() === 'STUDENT'; }, view: viewEquipment },
      { id: 'projects', label: 'My projects', icon: 'folder', group: 'Workspace', sub: 'Timeline, work log and outcome of your projects', show: function () { return role() === 'STUDENT'; }, view: viewProjects },
      { id: 'history', label: 'My history', icon: 'clock', group: 'Workspace', sub: 'Your visits and borrowing history', show: function () { return role() === 'STUDENT'; }, view: viewHistory },
      { id: 'live', label: 'Live', icon: 'activity', group: 'Monitor', sub: 'Who is in the lab right now and what is happening', show: function () { return can('staffSummary'); }, view: viewLive },
      { id: 'sessions', label: 'Sessions', icon: 'calendar', group: 'Monitor', sub: 'Live roster for today’s courses and events', show: function () { return can('facultySessions'); }, view: viewFaculty },
      { id: 'reviews', label: 'Reviews', icon: 'check', group: 'Monitor', sub: 'Check-ins waiting for a one-tap confirmation', show: function () { return can('reviewQueue'); }, view: viewReviews },
      { id: 'inventory', label: 'Inventory', icon: 'box', group: 'Lab', sub: 'The hardware catalog and its status', show: function () { return can('inventory'); }, view: viewInventory },
      { id: 'courses', label: 'Courses & events', icon: 'book', group: 'Lab', sub: 'Timetabled sessions and their enrolment', show: function () { return can('sessions'); }, view: viewCourses },
      { id: 'lookup', label: 'Lookup', icon: 'search', group: 'Lab', sub: 'Usage by register number or by system', show: function () { return can('lookupStudent') || can('lookupAsset'); }, view: viewLookup },
      { id: 'labprojects', label: 'Projects', icon: 'folder', group: 'Lab', sub: 'Every project in this lab, its hours and outcome', show: function () { return role() !== 'STUDENT' && can('projects'); }, view: viewProjects },
      { id: 'reports', label: 'Reports', icon: 'chart', group: 'Insights', sub: 'Daily digest, monthly audit, date ranges and exports', show: function () { return can('reportDaily') || can('exportRange'); }, view: viewReports },
      { id: 'settings', label: 'Settings', icon: 'sliders', group: 'Admin', sub: 'Lab location, geofence, hours and system settings', show: function () { return can('settingsGet'); }, view: viewSettings },
      { id: 'students', label: 'Students', icon: 'userPlus', group: 'Admin', sub: 'Add, remove and re-activate student accounts', show: function () { return can('students') && !can('users'); }, view: viewStudents },
      { id: 'people', label: 'People', icon: 'users', group: 'Admin', sub: 'Accounts, roles and permissions', show: function () { return can('users'); }, view: viewPeople },
      { id: 'audit', label: 'Audit', icon: 'shield', group: 'Admin', sub: 'Append-only log of sensitive actions', show: function () { return can('audit'); }, view: viewAudit }
    ];
    /** The lab's wall-screen QR page. In the preview it stays on this host so the sign-in cookie is kept. */
    function monitorUrl(labId) {

      if (!S.init) return renderLogin();

    /* ================= public pages: landing, log in, sign up ================= */

    // Pages that do not need a completed profile. Identity itself always comes from Google.
    var PUBLIC_PAGES = { landing: true, login: true, signup: true };

    function identity() {
      if (S.init && S.init.me) return { known: true, registered: !!S.init.me.registered, me: S.init.me };
      return { known: false, error: BOOT.error || null };
    }

    /** Navigate between pages without a reload; keeps the address bar in step where possible. */
    /** Signing out of a Google-identity app means signing out of Google, then choosing an account again. */
    function signOutUrl() {
      if (BOOT.dev) return '/logout';
      return 'https://accounts.google.com/Logout?continue=' + encodeURIComponent(switchAccountUrl('login'));
    }

    function goPage(page) {
      S.page = page;
      try {
        if (window.google && google.script && google.script.history) google.script.history.push(null, { view: page });
        else if (window.history && history.pushState) history.pushState(null, '', '?view=' + page);
      } catch (e) { /* history is a nicety; navigation already happened */ }
      render();
      window.scrollTo(0, 0);
    }

    function switchAccountUrl(back, email) {
      return 'https://accounts.google.com/AccountChooser?' + (email ? 'Email=' + encodeURIComponent(email) + '&' : '') + 'continue=' + encodeURIComponent(BOOT.webAppUrl + '?view=' + (back || 'login'));

    var GOOGLE_G = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.3 5.7c4.3-4 7-9.9 7-17.2z"/><path fill="#FBBC05" d="M10.6 28.6A14.4 14.4 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.2 0-11.5-4.1-13.4-9.9l-8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';

    function landingCtas(slot) {

          : '<button class="lx-btn lx-btn-dark lx-btn-lg" data-act="go" data-page="app">Open your dashboard</button><a class="lx-btn lx-btn-line lx-btn-lg" href="#how">How it works</a>';
      }

    }

    /** A decorative QR-like pattern for the hero (not scannable; the real one is on the lab screen). */
    function heroQr() {
      var n = 29, seed = 7, out = '';
      var rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      var finder = function (x, y) { return '<path d="M' + x + ' ' + y + 'h7v7h-7z M' + (x + 1) + ' ' + (y + 1) + 'v5h5v-5z" fill="#121212" fill-rule="evenodd"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" fill="#121212"/>'; };
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
        var inFinder = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
        if (!inFinder && rnd() < 0.47) out += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#121212"/>';
      }
      return out + finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7);
    }

    function renderLanding() {
      var tpl = document.getElementById('tpl-landing');

      app.querySelector('[data-slot="hero-cta"]').innerHTML = landingCtas('hero');
      app.querySelector('[data-slot="final-cta"]').innerHTML = landingCtas('hero');
      app.querySelector('[data-slot="qr"]').innerHTML = heroQr();
      var nav = document.getElementById('lx-nav');
      var onScroll = function () { if (nav) nav.classList.toggle('scrolled', window.scrollY > 8); };
      window.removeEventListener('scroll', S._lxScroll || onScroll);

      window.addEventListener('scroll', onScroll, { passive: true });
      if (S.occ !== null && S.occ !== undefined) app.querySelector('[data-slot="count"]').textContent = S.occ;
    }

    function authShell(inner) {

    /**

    function emailStep(prefill) {

      return '<form id="auth-email" novalidate>' +

    function domainError(e) {

        : e && e.message && e.code !== 'NO_IDENTITY' ? '<div class="lx-alert err">' + esc(e.message) + '</div>' : '';

    function submitEmail(f) {
      var email = String(f.querySelector('[name=email]').value || '').trim().toLowerCase();
      var err = document.getElementById('auth-error');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        err.textContent = 'Enter your full email address, e.g. urk24cs1249@karunya.edu.in';

      }
      var btn = document.getElementById('auth-btn');
      btn.disabled = true;
      btn.textContent = 'Continuing…';
      var id = identity();
      if (id.known && id.me.email.toLowerCase() === email) return goPage(id.registered ? 'app' : 'signup');
      if (BOOT.dev) { location.href = '/as?u=' + encodeURIComponent(email) + '&next=' + encodeURIComponent('/app?view=app'); return; }
      window.top.location.href = switchAccountUrl('app', email);

    function accountCard(me, sub) {
      return '<div class="lx-account"><span class="lx-avatar">' + esc(initials(me.name || me.email)) + '</span><span style="min-width:0;flex:1">' +
        '<b style="display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis">' + esc(me.name || me.email) + '</b>' +
        '<span class="lx-note">' + esc(sub || me.email) + '</span></span>' + GOOGLE_G + '</div>';

    function renderLogin() {
      var id = identity();
      document.getElementById('app').innerHTML = authShell(
        '<h1>Log in to <em>LabPulse</em></h1><p class="sub">Check in, reserve equipment and see your lab time.</p>' +
        (id.known ? '' : domainError(id.error)) + emailStep(id.known ? id.me.email : '') +
        '<p class="lx-switch">New to LabPulse? <a class="lx-link" data-act="go" data-page="signup">Create an account</a></p>');
    }

    function renderSignup() {
      var id = identity();
      var steps = function (n) { return '<div class="lx-steps-mini" aria-label="Step ' + n + ' of 2"><i class="on"></i><i' + (n > 1 ? ' class="on"' : '') + '></i></div>'; };
      var head = '<h1>Create your <em>account.</em></h1>';
      var stepNo = !id.known ? 1 : id.registered ? 0 : 2;
      if (stepNo) head = steps(stepNo) + head;
      var body;
      if (!id.known) {
        var e = id.error;
        body = '<p class="sub">Step 1 of 2 · Enter your Karunya email.</p>' + domainError(e) + emailStep('');
      } else if (id.registered) {
        body = '<p class="sub">You already have a LabPulse account.</p>' + accountCard(id.me, id.me.email + ' · ' + (ROLE_NAMES[id.me.role] || '')) +
          '<button class="lx-submit" style="margin-top:16px" data-act="go" data-page="app">Go to dashboard</button>';
      } else {
        var me = id.me;
        body = '<p class="sub">Step 2 of 2 · A one-time profile so faculty and lab staff know who you are.' +
          (BOOT.claim && BOOT.claim.ok ? ' Your QR scan is held for a few minutes while you finish.' : '') + '</p>' +
          '<form id="reg-form" novalidate>' +
          '<label class="lx-field"><span>Karunya email</span><input value="' + esc(me.email) + '" readonly><small>Not you? <a class="lx-link" ' + (BOOT.dev ? 'href="/logout?next=signup"' : 'href="' + esc(switchAccountUrl('signup')) + '" target="_top"') + '>Use a different email</a></small></label>' +
          '<label class="lx-field"><span>Full name</span><input name="name" value="' + esc(me.name || '') + '" required autocomplete="name" placeholder="As on your ID card"></label>' +
          '<label class="lx-field"><span>Register number / employee ID</span><input name="reg_no" value="' + esc(me.reg_no || '') + '" required placeholder="URK24CS1249" autocapitalize="characters"><small>Students: your register number. Staff and faculty: your employee ID.</small></label>' +
          '<label class="lx-field"><span>Mobile number</span><input name="mobile" required inputmode="tel" placeholder="98765 43210" autocomplete="tel"><small>Stored encrypted. Only lab staff and administrators can see it; it never appears in exports.</small></label>' +
          '<div id="reg-error" class="lx-alert err" style="display:none"></div>' +
          '<button class="lx-submit" id="reg-btn">Create account</button></form>';
      }
      document.getElementById('app').innerHTML = authShell(head + body +
        '<p class="lx-switch">Already have an account? <a class="lx-link" data-act="go" data-page="login">Log in</a></p>');
      var form = document.getElementById('reg-form');

        }).then(function (init) {

    /* ================= check-in flow (§4.1) ================= */

    function startCheckin(claim) {
      S.checkin = {
        claim: claim,
        expiresAt: Date.now() + (claim.expiresInSec || 300) * 1000,
        step: 'form',
        loc: { state: 'pending' },
        reason: { type: null, sessionId: '', purpose: '', equipment: '', equip: [], manual: false, m_code: '', m_name: '', m_coord: '', m_hours: '',
          systemId: '', projectId: '', newProject: false, np_title: '', np_end: '', np_desc: '' },
        options: null,
        result: null,
        error: null,
        requestId: null
      };
      render();
      startLocation();
      call('checkinOptions', { labId: claim.labId }).then(function (o) {
        S.checkin.options = o;
        if (S.checkin.step === 'form') renderCheckin();
      }, function () {
        S.checkin.options = { courses: [], events: [] };
        if (S.checkin.step === 'form') renderCheckin();
      });
    }

    function startLocation() {
      var c = S.checkin;
      c.loc = { state: 'pending' };
      paintLoc();
      if (!navigator.geolocation) {
        c.loc = { state: 'error', msg: 'This browser cannot share location. Ask lab staff for a supervised entry.' };
        return paintLoc();
      }
      var started = Date.now();
      var watch = navigator.geolocation.watchPosition(function (pos) {
        var acc = pos.coords.accuracy;
        if (!c.loc.best || acc < c.loc.best.accuracy) {
          c.loc.best = {
            lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: acc, ts: pos.timestamp || Date.now(),
            // Only a few browsers expose this; a missing flag proves nothing (§4.2 step 9).
            mock: pos.coords.mocked === true || pos.mocked === true || pos.coords.isMock === true ? true : null
          };
        }
        c.loc.state = 'ok';
        paintLoc();
        if (acc <= 15 || Date.now() - started > 20000) navigator.geolocation.clearWatch(watch);
      }, function (err) {
        if (c.loc.best) return;
        c.loc = err.code === 1
          ? { state: 'denied' }
          : { state: 'error', msg: err.code === 3 ? 'Getting a location fix took too long. Move near a window and retry.' : 'Your phone could not get a location fix. Retry, or ask lab staff.' };
        paintLoc();
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
      setTimeout(function () { navigator.geolocation.clearWatch(watch); }, 30000);
    }

    function locHtml() {
      var l = S.checkin.loc;
      if (l.state === 'pending') return '<div class="flex items-center gap-2 text-slate-600"><span class="lp-spin"></span> Getting your location… allow it when your phone asks.</div>';
      if (l.state === 'ok') {
        var a = Math.round(l.best.accuracy);
        return '<div class="flex items-center gap-2 flex-wrap">' + badge(a <= 30 ? 'green' : 'amber', a <= 30 ? 'Location ready' : 'Weak GPS') +
          '<span class="text-sm text-slate-600">accuracy ±' + a + ' m' + (a > 30 ? ' — you can still check in; it may need review' : '') + '</span></div>';
      }
      if (l.state === 'denied') {
        return '<div class="rounded-lg bg-amber-50 text-amber-900 text-sm p-3 space-y-1"><b>Location is blocked.</b>' +
          '<p>LabPulse needs your location once to confirm you are in the lab. Nothing is saved except whether you were inside.</p>' +
          '<p><b>To allow it:</b> tap the lock or ⓘ icon next to the address → Permissions → Location → Allow. Then tap Retry.</p>' +
          '<p>If you cannot share location, ask lab staff for a supervised manual entry.</p>' +
          '<button type="button" class="lp-btn lp-btn-ghost lp-btn-sm mt-1" data-act="loc-retry">Retry</button></div>';
      }
      return '<div class="rounded-lg bg-red-50 text-red-800 text-sm p-3">' + esc(l.msg) + ' <button type="button" class="underline" data-act="loc-retry">Retry</button></div>';
    }
    function paintLoc() {
      var el = document.getElementById('loc-status');
      if (el) el.innerHTML = locHtml();
      paintSubmit();
    }
    function equipmentText() {
      var r = S.checkin.reason;
      return r.equip.concat(r.equipment.trim() ? [r.equipment.trim()] : []).join(', ');
    }
    function reasonComplete() {
      var r = S.checkin.reason;
      var hours = Number(r.m_hours);
      if ((r.type === 'COURSE' || r.type === 'EVENT') && r.manual) {
        return hours >= 0.5 && (r.type === 'COURSE'
          ? r.m_code.trim().length >= 2 && r.m_name.trim().length >= 3
          : r.m_name.trim().length >= 3 && r.m_coord.trim().length >= 3);
      }
      if (r.type === 'COURSE' || r.type === 'EVENT') return !!r.sessionId;
      if (r.type === 'RESEARCH') {
        var hasProject = r.newProject ? r.np_title.trim().length >= 3 && /^\d{4}-\d{2}-\d{2}$/.test(r.np_end) : !!r.projectId;
        return r.purpose.trim().length >= 5 && equipmentText().length > 0 && hasProject;
      }
      return false;
    }

    function chip(act, id, label, on, extra) {
      return '<button type="button" class="rounded-full border px-3 py-1 text-sm ' + (on ? 'bg-teal-50 border-teal-600 text-teal-800 font-semibold' : 'bg-white border-slate-300') +
        '" aria-pressed="' + on + '" data-act="' + act + '" data-id="' + esc(id) + '">' + (on ? '✓ ' : '') + esc(label) + (extra || '') + '</button>';
    }

    /** Step 3: which system the student works at, and (for extra hours) which project. */
    function workFields() {
      var c = S.checkin;
      var r = c.reason;
      if (!r.type || !c.options) return '';
      var systems = (c.options.systems || []).map(function (s) {
        return chip('ci-system', s.asset_id, s.name, r.systemId === s.asset_id, s.in_use ? ' <span class="text-xs text-amber-700">· in use</span>' : '');
      }).join('') + chip('ci-system', 'OWN', 'Own laptop', r.systemId === 'OWN');
      var html = '<div><span class="lp-label">Which system are you working on? (optional)</span><div class="flex flex-wrap gap-2">' + systems + '</div></div>';
      if (r.type === 'RESEARCH') {
        var projects = (c.options.projects || []).map(function (p) {
          return '<button type="button" class="lp-option" aria-pressed="' + (!r.newProject && r.projectId === p.project_id) + '" data-act="ci-project" data-id="' + esc(p.project_id) + '">' +
            '<div class="font-semibold">' + esc(p.title) + '</div><div class="text-xs text-slate-500">until ' + esc(p.end_date) + '</div></button>';
        }).join('');
        html += '<div class="mt-4"><span class="lp-label">Which project is this time for?</span><div class="grid gap-2">' + projects +
          '<button type="button" class="lp-option" aria-pressed="' + r.newProject + '" data-act="ci-project" data-id="NEW"><div class="font-semibold">+ New project</div><div class="text-xs text-slate-500">Title and timeline; you can add details later</div></button></div>' +
          (r.newProject ? '<div class="space-y-3 mt-3">' +
            field('Project title', '<input class="lp-input" data-bind="np_title" placeholder="e.g. Smart irrigation with ESP32" value="' + esc(r.np_title) + '">') +
            field('Expected end date (timeline)', '<input class="lp-input" type="date" data-bind="np_end" value="' + esc(r.np_end) + '">') +
            field('Short description (optional)', '<textarea class="lp-input" rows="2" data-bind="np_desc">' + esc(r.np_desc) + '</textarea>') + '</div>' : '') + '</div>';
      }
      return html;
    }
    function paintSubmit() {
      var b = document.getElementById('ci-submit');
      if (!b) return;
      var ready = S.checkin.loc.state === 'ok' && reasonComplete();
      b.disabled = !ready;
      var hint = document.getElementById('ci-hint');
      if (hint) {
        hint.textContent = S.checkin.loc.state !== 'ok' ? 'Waiting for your location…' : !S.checkin.reason.type ? 'Choose why you are here.' : !reasonComplete() ? 'Complete the details above.' : '';
      }
    }

    function reasonFields() {
      var c = S.checkin;
      var r = c.reason;
      if (!r.type) return '';
      if (!c.options) return '<div class="mt-3">' + skeleton(48) + '</div>';
      if (r.type === 'RESEARCH') {
        var chips = (c.options.equipment || []).concat(['None']).map(function (t) {
          var on = r.equip.indexOf(t) !== -1;
          return '<button type="button" class="lp-chip" aria-pressed="' + on + '" data-act="ci-equip" data-type="' + esc(t) + '">' + (on ? '✓ ' : '') + esc(t) + '</button>';
        }).join('');
        return '<div class="space-y-3 mt-3">' +
          field('Purpose of visit', '<textarea class="lp-input" rows="2" data-bind="purpose" placeholder="e.g. Training a CNN for my final-year project">' + esc(r.purpose) + '</textarea>') +
          '<div><span class="lp-label">Specific hardware / equipment required</span><div class="flex flex-wrap gap-2">' + chips + '</div></div>' +
          field('Other equipment (optional)', '<input class="lp-input" data-bind="equipment" placeholder="anything not listed above" value="' + esc(r.equipment) + '">') + '</div>';
      }
      var isCourse = r.type === 'COURSE';
      var toggle = '<button type="button" class="text-sm text-teal-700 font-semibold mt-3" data-act="ci-manual">' +
        (r.manual ? '← Pick from the timetable instead' : 'My ' + (isCourse ? 'course' : 'event') + ' isn’t listed') + '</button>';
      if (r.manual) {
        return '<div class="space-y-3 mt-3">' +
          (isCourse
            ? field('Course code', '<input class="lp-input" data-bind="m_code" placeholder="23CS2048" autocapitalize="characters" value="' + esc(r.m_code) + '">') +
              field('Course name', '<input class="lp-input" data-bind="m_name" value="' + esc(r.m_name) + '">') +
              field('Session duration (hours)', '<input class="lp-input" data-bind="m_hours" inputmode="decimal" placeholder="2" value="' + esc(r.m_hours) + '">')
            : field('Event name', '<input class="lp-input" data-bind="m_name" value="' + esc(r.m_name) + '">') +
              field('Event coordinator name', '<input class="lp-input" data-bind="m_coord" value="' + esc(r.m_coord) + '">') +
              field('Expected duration (hours)', '<input class="lp-input" data-bind="m_hours" inputmode="decimal" placeholder="3" value="' + esc(r.m_hours) + '">')) +
          '<p class="text-xs text-slate-500">Not in the timetable, so lab staff will confirm it with one tap.</p></div>' + toggle;
      }
      var list = isCourse ? c.options.courses : c.options.events;
      if (!list.length) return '<p class="text-sm text-slate-600 mt-3">No ' + (isCourse ? 'lab course' : 'event') + ' is scheduled in this lab right now.</p>' + toggle;
      return '<div class="space-y-2 mt-3">' + list.map(function (s) {
        var sel = s.id === r.sessionId;
        return '<button type="button" class="lp-option" aria-pressed="' + sel + '" data-act="ci-session" data-id="' + esc(s.id) + '">' +
          '<div class="font-semibold">' + esc((s.code ? s.code + ' · ' : '') + s.name) + '</div>' +
          '<div class="text-xs text-slate-500 mt-0.5">' + esc([s.coordinator, s.start_time && s.end_time ? s.start_time + '–' + s.end_time : '', s.session_hours ? s.session_hours + ' h' : ''].filter(Boolean).join(' · ')) + '</div></button>';
      }).join('') + '</div>' + toggle;
    }

    function renderCheckin() {
      var c = S.checkin;
      var app = document.getElementById('app');
      var shell = function (inner) {
        return '<div class="min-h-screen max-w-md mx-auto px-4 pb-4 flex flex-col gap-4">' +
          '<div class="-mx-4 px-4 py-3 flex items-center gap-2.5 text-white" style="background:linear-gradient(135deg,#0b1220,#134e4a)"><div class="lp-logo !w-8 !h-8">' + icon('pulse', 'w-4 h-4') + '</div>' +
          '<div class="font-bold tracking-tight">LabPulse</div><span class="ml-auto text-xs text-teal-200 flex items-center gap-1.5">' + icon('lock', 'w-3.5 h-3.5') + 'Verified check-in</span></div>' + inner + '</div>';
      };
      if (!c.claim.ok) {
        app.innerHTML = shell('<div class="lp-card"><div class="lp-card-body text-center p-7"><div class="mx-auto w-12 h-12 rounded-2xl tone-red grid place-items-center mb-3">' + icon('alert', 'w-6 h-6') + '</div><h1 class="text-lg font-bold">Not checked in</h1>' +
          '<p class="text-slate-600 mt-2">' + esc(c.claim.message) + '</p>' +
          '<button class="lp-btn lp-btn-primary mt-5 w-full" data-act="ci-done">Go to my dashboard</button></div></div>');
        return;
      }
      if (c.step === 'submitting') {
        app.innerHTML = shell('<div class="lp-card"><div class="lp-card-body p-8 text-center"><div class="flex justify-center mb-3 text-teal-700"><span class="lp-spin" style="width:2rem;height:2rem"></span></div>' +
          '<h1 class="text-lg font-bold">Checking… please wait</h1><p class="text-sm text-slate-500 mt-1">Verifying your scan and location.</p></div></div>');
        return;
      }
      if (c.step === 'result') return renderCheckinResult(shell);
      var r = c.reason;
      var opt = function (type, title, sub) {
        return '<button type="button" class="lp-option" aria-pressed="' + (r.type === type) + '" data-act="ci-type" data-type="' + type + '">' +
          '<div class="font-semibold">' + title + '</div><div class="text-xs text-slate-500">' + sub + '</div></button>';
      };
      var step = function (n, title) { return '<div class="flex items-center gap-2.5 mb-3"><span class="lp-step">' + n + '</span><span class="font-semibold">' + title + '</span></div>'; };
      app.innerHTML = shell(
        '<div class="lp-card"><div class="lp-card-body"><div class="text-[11px] uppercase tracking-wider text-slate-500 font-bold">Checking in to</div>' +
        '<div class="text-xl font-bold tracking-tight">' + esc(c.claim.labName) + '</div>' +
        '<div class="text-xs text-slate-500 mt-1 flex items-center gap-1.5">' + icon('clock', 'w-3.5 h-3.5') + 'Finish within ' + Math.max(1, Math.round((c.expiresAt - Date.now()) / 60000)) + ' minutes, or scan again.</div></div></div>' +
        '<div class="lp-card"><div class="lp-card-body">' + step(1, 'Location') + '<div id="loc-status">' + locHtml() + '</div></div></div>' +
        '<div class="lp-card"><div class="lp-card-body">' + step(2, 'Why are you here?') + '<div class="grid gap-2">' +
        opt('COURSE', 'Regular lab course', 'Course code, name and session hours fill in from the timetable') +
        opt('EVENT', 'Event / workshop', 'Event name, coordinator and expected duration') +
        opt('RESEARCH', 'Individual research / extra hours', 'Your project, today’s purpose and the equipment you need') +
        '</div><div id="ci-fields">' + reasonFields() + '</div></div></div>' +
        (r.type ? '<div class="lp-card"><div class="lp-card-body">' + step(3, 'What are you working on?') + workFields() + '</div></div>' : '') +
        (c.error ? '<div class="rounded-xl bg-red-50 text-red-800 text-sm p-3 flex gap-2">' + icon('alert', 'w-4 h-4 flex-none mt-0.5') + '<span>' + esc(c.error.message) + '</span></div>' : '') +
        '<div class="sticky bottom-0 pt-2 pb-4" style="background:linear-gradient(transparent,var(--lp-page) 30%)"><button class="lp-btn lp-btn-primary w-full !py-3 text-base" id="ci-submit" data-act="ci-submit" disabled>Check in</button>' +
        '<p id="ci-hint" class="text-center text-xs text-slate-500 mt-2"></p></div>'
      );
      paintSubmit();
    }

    function renderCheckinResult(shell) {
      var res = S.checkin.result;
      var o = res.outcome;
      var v = res.visit;
      var head = o === 'GREEN' ? ['check', 'Checked in', 'bg-green-50 text-green-900 border border-green-200', 'tone-teal']
        : o === 'AMBER' ? ['clock', 'Checked in — pending review', 'bg-amber-50 text-amber-900 border border-amber-200', 'tone-amber']
        : o === 'EXISTING' ? ['check', 'You are already checked in', 'bg-blue-50 text-blue-900 border border-blue-200', 'tone-blue']
        : ['alert', 'Not checked in', 'bg-red-50 text-red-900 border border-red-200', 'tone-red'];
      var why = (res.reasons || []).length ? '<ul class="text-sm mt-3 text-left list-disc pl-5 space-y-1">' + res.reasons.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '';
      var note = o === 'AMBER' ? '<p class="text-sm mt-3">You count as inside. Your ' + (v && v.entry_type === 'RESEARCH' ? 'lab staff' : 'faculty') + ' will confirm with one tap.</p>'
        : o === 'RED' ? '<p class="text-sm mt-3">If you are in the lab, move closer to the centre of the room and scan the QR again, or ask lab staff.</p>' : '';
      document.getElementById('app').innerHTML = shell(
        '<div class="rounded-2xl p-6 text-center ' + head[2] + '"><div class="mx-auto w-14 h-14 rounded-2xl grid place-items-center mb-3 ' + head[3] + '">' + icon(head[0], 'w-7 h-7') + '</div><h1 class="text-xl font-bold tracking-tight">' + head[1] + '</h1>' +
        (v ? '<p class="mt-2 font-medium">' + esc(v.lab_name) + '</p><p class="text-sm">' + esc(v.label) + ' · since ' + fmtTime(v.check_in_at) + '</p>' : '') +
        why + note + '</div>' +
        '<button class="lp-btn lp-btn-primary w-full !py-3" data-act="ci-done">Go to my dashboard</button>');
    }

    function submitCheckin() {
      var c = S.checkin;
      if (!c.loc.best || !reasonComplete()) return;
      var r0 = c.reason;
      if (r0.type === 'RESEARCH' && r0.newProject) {
        c.step = 'submitting';
        renderCheckin();
        return call('projectSave', { lab_id: c.claim.labId, title: r0.np_title, end_date: r0.np_end, description: r0.np_desc }).then(function (p) {
          r0.projectId = p.project_id;
          r0.newProject = false;
          c.options.projects = (c.options.projects || []).concat([{ project_id: p.project_id, title: p.title, end_date: p.end_date }]);
          c.step = 'form';
          submitCheckin();
        }, function (e) {
          c.step = 'form';
          c.error = e;
          renderCheckin();
        });
      }
      c.requestId = c.requestId || rid();
      var b = c.loc.best;
      var r = c.reason;
      var payload = {
        labId: c.claim.labId, lat: b.lat, lng: b.lng, accuracy: b.accuracy, mock: b.mock, posAgeMs: Date.now() - b.ts,
        requestId: c.requestId,
        reason: Object.assign(r.type === 'RESEARCH' ? { type: r.type, purpose: r.purpose, equipment: equipmentText(), projectId: r.projectId }
          : r.manual ? { type: r.type, manual: r.type === 'COURSE'
            ? { code: r.m_code, name: r.m_name, hours: Number(r.m_hours) }
            : { event_name: r.m_name, coordinator: r.m_coord, hours: Number(r.m_hours) } }
          : { type: r.type, sessionId: r.sessionId }, { systemId: r.systemId })
      };
      c.step = 'submitting';
      c.error = null;
      renderCheckin();
      var attempt = 0;
      (function tryOnce() {
        call('checkIn', payload).then(function (res) {
          c.result = res;
          c.step = 'result';
          renderCheckin();
        }, function (e) {
          // A network drop is retried with the same request ID, so it can never create a second visit.
          if (e.code === 'NETWORK' && attempt++ < 2) return sleep(1500).then(tryOnce);
          c.step = 'form';
          c.error = e;
          if (e.code !== 'NETWORK') c.requestId = null;
          renderCheckin();
        });
      })();
    }

    /* ================= student ================= */

    function studentLab() { return S.status && S.status.visit ? S.status.visit.lab_id : S.lab; }

    function viewHome() {
      return section('status', { live: true, height: 140, load: function () { return call('status'); }, html: htmlStatus }) +
        section('myhours', { height: 92, load: function () { return call('myHours'); }, html: function (h) {
          return '<div class="lp-band" style="--cols:4">' +
            statTile('Total hours', esc(h.total_hours), { icon: 'clock', tone: 'teal' }) +
            statTile('Days in lab', esc(h.total_days), { icon: 'calendar', tone: 'blue' }) +
            statTile('This week', esc(h.week_hours) + '<span class="text-sm font-semibold text-slate-400"> h</span>', { icon: 'activity', tone: 'violet' }) +
            statTile('Last visit', '<span class="text-lg">' + esc(h.last_visit || '—') + '</span>', { icon: 'history', tone: 'slate' }) + '</div>';
        } }) +
        '<div class="grid lg:grid-cols-2 gap-5 items-start">' +
        section('free', { live: true, load: function () { return call('freeNow', { labId: studentLab() }); }, html: htmlFree }) +
        section('mybookings', { live: true, load: function () { return call('myBookings'); }, html: htmlMyBookings }) + '</div>' +
        section('myitems', { live: true, height: 1, load: function () { return call('myItems'); }, html: function (d) {
          // Only shown when there is something borrowed or requested.
          return d.loans.some(function (l) { return l.status !== 'RETURNED'; }) || d.requests.some(function (r) { return r.status === 'PENDING'; }) ? htmlMyItems(d) : '';
        } });
    }

    function htmlStatus(st) {
      var changed = !S.status || !!S.status.checkedIn !== !!st.checkedIn;
      S.status = st;
      if (changed) setTimeout(function () { paintSection('free'); }, 0);
      setTimeout(ensurePresence, 0);
      var hero = function (bg, iconName, inner, action) {
        return '<section class="rounded-2xl p-5 sm:p-6 text-white shadow-sm" style="background:' + bg + '">' +
          '<div class="flex items-start gap-4 flex-wrap"><div class="w-12 h-12 rounded-2xl bg-white/15 grid place-items-center flex-none">' + icon(iconName, 'w-6 h-6') + '</div>' +
          '<div class="min-w-0 flex-1" style="flex-basis:14rem">' + inner + '</div><div class="flex-none">' + action + '</div></div></section>';
      };
      if (st.checkedIn) {
        var v = st.visit;
        var pending = v.review_status === 'PENDING';
        return hero(pending ? 'linear-gradient(135deg,#92400e,#b45309)' : 'linear-gradient(135deg,#0f766e,#115e59)', pending ? 'clock' : 'check',
          '<div class="text-xs uppercase tracking-wider text-white/70 font-bold">' + esc(v.lab_name) + '</div>' +
          '<div class="text-2xl font-bold tracking-tight mt-0.5">Checked in · ' + dur(v.duration_ms) + '</div>' +
          '<div class="text-white/85 mt-1 text-sm">' + esc(v.label) + '</div>' +
          '<div class="text-xs text-white/70 mt-2">Since ' + fmtTime(v.check_in_at) + (v.expected_end_at ? ' · closes automatically at ' + fmtTime(v.expected_end_at) + ' if you forget' : '') + '</div>' +
          (pending ? '<div class="text-xs mt-2 rounded-lg bg-white/15 px-2.5 py-1.5 inline-block">Waiting for a one-tap review. You’ll count in the live total once confirmed.</div>' : '') +
          '<div id="presence-line">' + presenceLine() + '</div>',
          '<button class="lp-btn bg-white text-teal-900 hover:bg-teal-50" data-act="checkout">Check out</button>');
      }
      if (st.ticket) {
        return hero('linear-gradient(135deg,#1e3a8a,#1d4ed8)', 'qr',
          '<div class="text-2xl font-bold tracking-tight">Scan received</div><div class="text-white/85 text-sm mt-1">Finish checking in to ' + esc(st.ticket.labName) + ' within ' + Math.max(1, Math.round(st.ticket.expiresInSec / 60)) + ' min.</div>',
          '<button class="lp-btn bg-white text-blue-900 hover:bg-blue-50" data-act="resume-checkin" data-lab="' + esc(st.ticket.labId) + '" data-name="' + esc(st.ticket.labName) + '" data-exp="' + st.ticket.expiresInSec + '">Continue check-in</button>');
      }
      return hero('#0f1412', 'qr',
        '<div class="text-2xl font-bold tracking-tight">Not checked in</div><div class="text-white/80 text-sm mt-1">Scan the QR on the lab monitor with your phone camera to check in.</div>',
        '<button class="lp-btn bg-white text-slate-900 hover:bg-slate-100" data-act="scan-help">' + icon('qr') + 'How to scan</button>');
    }

    /* ---------- GPS live mode: while checked in, the open page confirms the student is still inside ---------- */

    var LIVE = { timer: null, visitId: null, last: null, lastAt: 0, err: '', lock: null, busy: false };
    function presenceWanted() {
      var st = S.status;
      return !!(S.init && S.init.presenceEnabled && st && st.checkedIn && st.visit && st.visit.confidence !== 'MANUAL');
    }
    function ensurePresence() {
      if (!presenceWanted()) return stopPresence();
      if (LIVE.timer && LIVE.visitId === S.status.visit.visit_id) return;
      stopPresence();
      LIVE.visitId = S.status.visit.visit_id;
      LIVE.timer = setInterval(sendPresence, Math.max(15, S.init.presencePingSec || 60) * 1000);
      setTimeout(sendPresence, 1500);
      keepAwake();
    }
    function stopPresence() {
      if (LIVE.timer) clearInterval(LIVE.timer);
      LIVE.timer = null;
      LIVE.visitId = null;
      LIVE.last = null;
      if (LIVE.lock) { try { LIVE.lock.release(); } catch (e) {} LIVE.lock = null; }
    }
    /** Keeps the screen on so the browser keeps sending location (a locked phone stops every web page). */
    function keepAwake() {
      try {
        if (!LIVE.lock && !document.hidden && navigator.wakeLock) {
          navigator.wakeLock.request('screen').then(function (l) {
            LIVE.lock = l;
            l.addEventListener('release', function () { LIVE.lock = null; });
          }, function () {});
        }
      } catch (e) { /* not supported: pings still run while the page is in front */ }
    }
    function sendPresence() {
      if (!LIVE.timer || document.hidden || LIVE.busy) return;
      if (!navigator.geolocation) { LIVE.err = 'This browser cannot share location.'; return paintPresence(); }
      LIVE.busy = true;
      navigator.geolocation.getCurrentPosition(function (pos) {
        call('presencePing', { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, posAgeMs: Date.now() - pos.timestamp }).then(function (r) {
          LIVE.busy = false;
          if (!r.active) { stopPresence(); reloadVisible(); return; } // checked out (by you, staff or the rules)
          LIVE.last = r;
          LIVE.lastAt = Date.now();
          LIVE.err = '';
          paintPresence();
        }, function () { LIVE.busy = false; });
      }, function (e) {
        LIVE.busy = false;
        LIVE.err = e && e.code === 1 ? 'Location is blocked. Allow it for this site, or you will show as “Not seen”.' : 'Could not read your location. Move near a window if this keeps happening.';
        paintPresence();
      }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
    }
    function presenceLine() {
      if (!presenceWanted()) return '';
      var g = S.init;
      var r = LIVE.last;
      var state = LIVE.err ? '<span class="text-amber-200">' + esc(LIVE.err) + '</span>'
        : !r ? 'Starting live presence…'
        : r.state === 'OUT' ? '<b class="text-red-200">You appear to be outside the lab.</b> Go back in, or check out.'
        : r.reading === 'WEAK' ? 'Live presence on · weak GPS, holding your last position · ' + fmtTime(LIVE.lastAt)
        : 'Live presence on · inside the lab · ' + fmtTime(LIVE.lastAt);
      return '<div class="mt-3 text-xs text-white/80 flex items-start gap-2"><span class="lp-live-dot' + (r && r.state === 'OUT' ? ' out' : '') + '"></span><span>' + state +
        '<br><span class="text-white/60">Keep LabPulse open during your session. Closed for ' + g.presenceNotSeenMin + ' min shows you as “Not seen”; ' + g.presenceAwayMin + ' min out or unseen checks you out.</span></span></div>';

    function htmlFree(list) {

    function viewEquipment() {
      return section('catalog', { live: true, height: 320, load: function () {
        return Promise.all([call('assetsPublic', { labId: studentLab() }), call('status')]).then(function (r) { return { list: r[0], status: r[1] }; });
      }, html: function (d) {
        S.status = d.status;
        var list = d.list;
        var f = S.catFilter || 'ALL';
        var cats = Object.keys(CATEGORY_NAMES).filter(function (c) { return list.some(function (a) { return a.category === c; }); });
        var verified = d.status.checkedIn && d.status.visit.review_status !== 'PENDING';
        var free = list.filter(function (a) { return a.status === 'AVAILABLE'; }).length;
        var seg = '<div class="lp-seg">' + ['ALL'].concat(cats).map(function (c) {
          var n = c === 'ALL' ? list.length : list.filter(function (a) { return a.category === c; }).length;

        }).join('') + '</div>';

        var cardsHtml = shown.length ? '<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">' + shown.map(function (a) {
          var avail = a.status === 'AVAILABLE';
          return '<div class="lp-card p-4 flex flex-col gap-3"><div class="flex items-start gap-3"><div class="lp-stat-icon tone-' + (avail ? 'teal' : 'slate') + '">' + icon(CATEGORY_ICONS[a.category] || 'box') + '</div>' +
            '<div class="min-w-0 flex-1"><div class="font-semibold leading-snug">' + esc(a.name) + '</div><div class="text-xs text-slate-500 mt-0.5">' + esc(a.type) + (a.location ? ' · ' + esc(a.location) : '') + ' · ' + esc(a.asset_id) + '</div></div>' + assetBadge(a.status) + '</div>' +
            '<div class="flex gap-2 mt-auto">' +
            (can('requestAsset') ? '<button class="lp-btn lp-btn-primary lp-btn-sm" data-act="request-asset" data-id="' + esc(a.asset_id) + '"' + (avail && verified ? '' : ' disabled') + '>Request now</button>' : '') +
            (can('bookAsset') ? '<button class="lp-btn lp-btn-ghost lp-btn-sm" data-act="booking-new" data-id="' + esc(a.asset_id) + '"' + (bookingGated() || a.status === 'UNAVAILABLE' ? ' disabled' : '') + '>Reserve a slot</button>' : '') +
            '</div></div>';
        }).join('') + '</div>' : empty('Nothing in this category.', 'box');
        var note = verified ? '' : '<div class="rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-sm px-4 py-3 flex gap-2">' + icon('lock', 'w-4 h-4 flex-none mt-0.5') +
          '<span>' + (d.status.checkedIn ? 'Your check-in is waiting for review. Requests open once it is confirmed.' : 'You can request equipment only while you are checked in to the lab. Scan the QR on the lab monitor first.') + '</span></div>';
        return '<div class="lp-band" style="--cols:4">' + statTile('Items in the lab', esc(list.length), { icon: 'box', tone: 'slate' }) +
          statTile('Free right now', esc(free), { icon: 'check', tone: 'teal' }) +
          statTile('Reserved', esc(list.filter(function (a) { return a.status === 'RESERVED'; }).length), { icon: 'calendar', tone: 'amber' }) +
          statTile('Issued / in use', esc(list.filter(function (a) { return a.status === 'ISSUED' || a.status === 'IN_USE'; }).length), { icon: 'users', tone: 'blue' }) + '</div>' +
          note + seg + cardsHtml + '<p class="text-xs text-slate-500">Borrower details are never shown here. Status comes from LabPulse records.</p>';
      } }) + section('map', { live: true, height: 240, load: function () { return call('labMap', { labId: studentLab() }); }, html: htmlMap });
    }

    function bookingBadge(b) {
      return {

        DONE: badge('gray', 'Done'), CANCELLED: badge('gray', 'Cancelled'), NO_SHOW: badge('red', 'No-show'), EXPIRED: badge('gray', 'Expired')
      }[b.status] || badge('gray', b.status);
    }
    function slotText(b) { return fmtDT(b.start_at) + '–' + fmtTime(b.end_at); }

    function htmlMyBookings(list) {
      var rows = list.map(function (b) {
        var open = b.status === 'BOOKED' || b.status === 'WAITLIST';
        return '<li class="flex items-center justify-between gap-2 py-2"><div><div class="font-medium">' + esc(b.asset_name) + '</div>' +
          '<div class="text-xs text-slate-500">' + esc(slotText(b)) + ' · ' + esc(b.purpose || '') + '</div>' +
          (b.status === 'WAITLIST' ? '<div class="text-xs text-amber-800">You are number ' + b.position + ' in the queue. We email you if the slot frees up.</div>' : '') +
          (b.status === 'BOOKED' ? '<div class="text-xs text-teal-800">Check in to the lab at that time; lab staff start your session.</div>' : '') + '</div>' +
          '<div class="flex items-center gap-2">' + bookingBadge(b) + (open ? '<button class="lp-btn lp-btn-ghost lp-btn-sm" data-act="booking-cancel" data-id="' + esc(b.booking_id) + '">Cancel</button>' : '') + '</div></li>';
      });
      var gated = bookingGated();

    /** True while reservations are closed to this student (proposal C: CHECKED_IN and verified). */
    function bookingGated() {
      if (!S.init.bookingRequiresCheckin) return false;
      return !(S.status && S.status.checkedIn && S.status.visit && S.status.visit.review_status !== 'PENDING');
    }

    function htmlBookingsToday(list) {
      var act = can('startBooking');
      return card('Today’s reservations', list.length ? '<ul class="space-y-2">' + list.map(function (b) {
        return '<li class="rounded-lg bg-slate-50 p-3 text-sm"><div class="flex justify-between gap-2"><b>' + esc(b.asset_name) + '</b>' + bookingBadge(b) + '</div>' +
          '<div class="text-xs text-slate-600">' + esc(fmtTime(b.start_at) + '–' + fmtTime(b.end_at)) + ' · ' + esc(b.user_name) + ' · ' + esc(b.reg_no) +

          (act && b.status === 'IN_USE' ? '<button class="lp-btn lp-btn-ghost lp-btn-sm mt-2" data-act="booking-finish" data-id="' + esc(b.booking_id) + '" data-name="' + esc(b.asset_name) + '">Finish session</button>' : '') + '</li>';

    function htmlMyItems(d) {
      var open = d.loans.filter(function (l) { return l.status !== 'RETURNED'; });

          (l.overdue ? badge('red', 'Overdue') : badge('blue', 'Borrowed')) + '</li>';
      }).concat(pending.map(function (r) {
        return '<li class="flex items-center justify-between gap-2 py-2"><div><div class="font-medium">' + esc(r.asset_name) + '</div><div class="text-xs text-slate-500">Requested ' + fmtTime(r.created_at) + ' · collect from lab staff</div></div>' +
          '<div class="flex items-center gap-2">' + badge('amber', 'Requested') + '<button class="lp-btn lp-btn-ghost lp-btn-sm" data-act="cancel-request" data-id="' + esc(r.request_id) + '">Cancel</button></div></li>';

    function htmlMap(m) {
      var grid = [];
      for (var y = 0; y < m.rows; y++) for (var x = 0; x < m.cols; x++) grid.push(null);
      m.cells.forEach(function (c) { if (c.map_y < m.rows && c.map_x < m.cols) grid[c.map_y * m.cols + c.map_x] = c; });
      var color = { AVAILABLE: 'lp-green', RESERVED: 'lp-amber', ISSUED: 'lp-blue', IN_USE: 'lp-blue', UNAVAILABLE: 'lp-gray' };
      var cells = grid.map(function (c) {
        if (!c) return '<div class="lp-cell"></div>';
        return '<div class="lp-cell has ' + (color[c.status] || 'lp-gray') + '" title="' + esc(c.name + ' — ' + c.status) + '">' + esc(c.asset_id) + '</div>';
      }).join('');
      var legend = '<div class="flex flex-wrap gap-2 mt-3">' + badge('green', 'Available') + badge('amber', 'Reserved') + badge('blue', 'Issued / in use') + badge('gray', 'Unavailable') + '</div>';
      return card('Live lab map', '<div class="lp-map" style="grid-template-columns:repeat(' + m.cols + ',minmax(0,1fr))">' + cells + '</div>' + legend +
        '<p class="text-xs text-slate-500 mt-2">' + esc(m.note) + '</p>', '<span class="text-xs text-slate-500">' + m.occupancy + (m.occupancy === 1 ? ' person' : ' people') + ' inside</span>');
    }

    function htmlVisits(list) {

      }));

    /** Live page: one stats strip, then one focused sub-view at a time instead of every panel at once. */
    function presenceSub(s) {
      var pr = s.presence || {};
      var bits = [];
      if (pr.out) bits.push('<span class="text-red-700">' + pr.out + ' out</span>');
      if (pr.not_seen) bits.push(pr.not_seen + ' not seen');
      if (s.pending_inside) bits.push('<span class="text-amber-700">+' + s.pending_inside + ' awaiting review</span>');
      return bits.length ? bits.join(' · ') : 'All confirmed inside';
    }
    var LIVE_VIEWS = [['overview', 'Overview'], ['desk', 'Equipment desk'], ['activity', 'Activity'], ['map', 'Floor map']];
    function viewLive() {
      var v = S.liveView || 'overview';
      var views = LIVE_VIEWS.filter(function (x) { return x[0] !== 'desk' || can('handshake') || can('bookingsToday'); });
      var seg = '<div class="lp-seg" role="tablist">' + views.map(function (x) {
        return '<button aria-pressed="' + (x[0] === v) + '" data-act="live-view" data-view="' + x[0] + '">' + x[1] + '</button>';
      }).join('') + (can('monitorTick') ? '<span style="margin-left:auto;align-self:center">' + monitorLink('lp-btn lp-btn-primary lp-btn-sm', 'Open QR screen') + '</span>' : '') + '</div>';
      var strip = section('strip', { live: true, height: 96, load: function () { return call('staffSummary', { labId: S.lab }); }, html: function (s) {
        S.occ = s.occupancy;
        S.occPending = s.pending_inside;
        paintOcc();
        return '<div class="lp-band" style="--cols:5">' +
          statTile('Inside now', esc(s.occupancy), { sub: presenceSub(s) }) +
          statTile('Items out', esc(s.items_out), { sub: 'On loan now' }) +
          statTile('Overdue', '<span' + (s.overdue ? ' class="text-red-700"' : '') + '>' + esc(s.overdue) + '</span>', { sub: s.overdue ? 'Reminders sent' : 'Nothing late' }) +
          statTile('Pending requests', esc(s.pending_requests), { sub: 'Waiting for handover' }) +
          statTile('Pending reviews', esc(s.pending_reviews), { sub: can('reviewQueue') ? 'Open the review queue →' : 'Awaiting faculty', tab: can('reviewQueue') ? 'reviews' : '' }) + '</div>';
      } });
      var body;
      if (v === 'desk') {
        body = '<div class="grid lg:grid-cols-2 gap-5 items-start">' +
          (can('bookingsToday') ? section('bookings', { live: true, load: function () { return call('bookingsToday', { labId: S.lab }); }, html: htmlBookingsToday }) : '') +
          (can('handshake') ? section('handshake', { live: true, height: 300, load: function () { return call('handshake', { labId: S.lab }); }, html: htmlHandshake }) : '') + '</div>';
      } else if (v === 'activity') {
        body = section('activity', { live: true, height: 300, load: function () { return call('activity', { labId: S.lab }); }, html: htmlActivity });
      } else if (v === 'map') {
        body = section('smap', { live: true, height: 300, load: function () { return call('labMap', { labId: S.lab }); }, html: htmlMap });
      } else {
        body = section('today', { height: 260, load: function () { return call('reportDaily', { labId: S.lab }) /* the server's today, not the device's */; }, html: function (r) {
            var peak = (r.peaks || [])[0];
            return card('People in the lab today, by hour', hourChart(r.hours) +
              '<p class="text-xs text-slate-500 mt-3">Each column counts different people present during that hour.' + (peak ? ' Busiest: ' + String(peak.hour).padStart(2, '0') + ':00, up to ' + peak.peak + ' at once.' : '') + '</p>',
              '<button class="lp-btn lp-btn-ghost lp-btn-sm" data-act="reload-today">Refresh</button>');
          } }) +
          section('inside', { live: true, load: function () { return call('inside', { labId: S.lab }); }, html: htmlInside });
      }
      return strip + seg + body;

    function presenceBadge(p) {

      if (p.state === 'IN') return badge('green', 'In') + '<div class="text-xs text-slate-500 mt-1">seen ' + fmtTime(p.last_seen) + '</div>';
      if (p.state === 'OUT') return badge('red', 'Out') + '<div class="text-xs text-red-700 mt-1">left ' + fmtTime(p.out_since) + '</div>';
      return badge('gray', 'Not seen') + '<div class="text-xs text-slate-500 mt-1">since ' + fmtTime(p.last_seen) + '</div>';
    }

    function htmlInside(list) {
      var rows = list.map(function (p) {

        MANUAL_ENTRY: ['blue', 'Manual entry'], MANUAL_ENTRY_OVERRIDE_HOURS: ['blue', 'Manual (after hours)'], REVIEW_CONFIRM: ['green', 'Review confirmed'],
        REVIEW_DECLINE: ['red', 'Review declined'], REQUEST: ['amber', 'Request'], ISSUE: ['blue', 'Issued'], RETURN: ['green', 'Returned'], LOAN_OVERDUE: ['red', 'Overdue'],
        PRESENCE_OUT: ['red', 'Left the lab'], PRESENCE_BACK: ['green', 'Back in the lab'], LEFT_DURING_SESSION: ['red', 'Left during session'],
        SECURITY_CHECKIN_RED: ['red', 'Rejected check-in'], SECURITY_QR_REUSED: ['red', 'Reused QR'], SECURITY_QR_EXPIRED: ['red', 'Expired QR'], SECURITY_QR_INVALID: ['red', 'Invalid QR']
