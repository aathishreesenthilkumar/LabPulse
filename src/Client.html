            '<p class="text-sm text-slate-600">For students who cannot share location, or entries outside operating hours. Every manual entry is audit-logged with your name.</p>' +
            field('Student email', input('email', '', 'type="email" required')) +
            field('Reason for visit', select('type', [['RESEARCH', 'Individual research']].concat(active.map(function (s) { return [s.type + ':' + s.id, (s.code ? s.code + ' · ' : '') + s.name]; })), 'RESEARCH')) +
            field('Purpose (for research)', input('purpose', '')) +
            field('Why a manual entry?', input('why', '', 'required placeholder="e.g. Location permission blocked on phone"')),
            function (v) {
              var parts = v.type.split(':');
              var reason = parts.length === 2 ? { type: parts[0], sessionId: parts[1] } : { type: 'RESEARCH', purpose: v.purpose || 'Supervised entry', equipment: 'As required' };
              return call('manualEntry', { email: v.email, labId: S.lab, reason: reason, why: v.why }).then(function () { toast('Manual entry recorded.'); reloadVisible(); refreshOcc(); });
            }, 'Check in');
        }, function (e) { toast(e.message, 'error'); });
      },
      'issue': function (d) {
        openModal('Confirm handover: ' + d.name, '<p class="text-sm text-slate-600">Hand the item to <b>' + esc(d.who) + '</b>, then confirm.</p>' +
          field('Due back', input('dueAt', toLocalInput(d.due), 'type="datetime-local" required')) +
          field('Condition at issue', select('condition', ['GOOD', 'FAIR', 'DAMAGED'], 'GOOD')),
          function (v) {
            return call('issueAsset', { requestId: d.id, dueAt: fromLocalInput(v.dueAt), condition: v.condition }).then(function () { toast('Issued.'); reloadVisible(); });
          }, 'Confirm issue');
      },
      'reject': function (d) {
        openModal('Reject request', field('Reason', input('reason', '', 'placeholder="e.g. Reserved for a lab course"')), function (v) {
          return call('rejectRequest', { requestId: d.id, reason: v.reason }).then(function () { toast('Rejected.'); reloadVisible(); });
        }, 'Reject');
      },
      'return': function (d) {
        openModal('Mark returned: ' + d.name, field('Condition on return', select('condition', ['GOOD', 'FAIR', 'DAMAGED'], 'GOOD')) + field('Notes', input('notes', '')) +
          '<p class="text-xs text-slate-500">Damaged items move to maintenance and leave the available list.</p>', function (v) {
          return call('returnAsset', { loanId: d.id, condition: v.condition, notes: v.notes }).then(function () { toast('Return recorded.'); reloadVisible(); });
        }, 'Record return');
      },

      'asset-edit': function (d) {
        var list = (S.sections.inventory && S.sections.inventory.data) || [];
        var a = d.id ? list.filter(function (x) { return x.asset_id === d.id; })[0] : null;
        openModal(a ? 'Edit ' + a.asset_id : 'Add inventory item', assetForm(a), function (v) {
          v.lab_id = S.lab;
          return call('inventorySave', v).then(function () { toast('Saved.'); loadSection('inventory'); });
        });
      },
      'asset-remove': function (d) {
        openModal('Remove ' + d.id + '?', '<p class="text-sm text-slate-600">The item leaves the catalog. Its history stays in reports and the audit log.</p>' + field('Reason', input('reason', '', 'required')), function (v) {
          return call('inventoryRemove', { assetId: d.id, reason: v.reason }).then(function () { toast('Removed.'); loadSection('inventory'); });
        }, 'Remove');
      },
      'course-edit': function (d) {
        var list = (S.sections.courses && S.sections.courses.data) || [];
        var s = d.id ? list.filter(function (x) { return x.id === d.id; })[0] : null;
        openModal(s ? 'Edit ' + (s.code || s.name) : 'Add course or event', courseForm(s), function (v) {
          v.lab_id = S.lab;
          return call('sessionSave', v).then(function () { toast('Saved.'); loadSection('courses'); });
        });
      },

      'report-kind': function (d) { S.report.kind = d.kind; render(); },
      'report-run': function (d, el) {
        var out = document.getElementById('report-out');
        out.innerHTML = skeleton(200);
        call(S.report.kind === 'daily' ? 'reportDaily' : 'reportPeriod', reportParams()).then(function (r) { out.innerHTML = htmlReport(r); }, function (e) { out.innerHTML = errorBox(e); });
      },
      'report-pdf': function (d, el) {
        el.disabled = true;
        el.innerHTML = '<span class="lp-spin"></span> Building PDF…';
        call('reportPdf', reportParams()).then(function (f) {
          el.disabled = false;
          el.textContent = 'Save PDF to Drive';
          document.getElementById('report-out').insertAdjacentHTML('afterbegin', '<div class="lp-card p-3 mb-3 text-sm">Saved: <a class="text-teal-700 underline" target="_blank" href="' + esc(f.url) + '">' + esc(f.name) + '</a></div>');
        }, function (e) { el.disabled = false; el.textContent = 'Save PDF to Drive'; toast(e.message, 'error'); });
      },
      'report-email': function (d, el) {
        el.disabled = true;
        call('emailDigest', reportParams()).then(function (r) { el.disabled = false; toast('Digest emailed to ' + r.recipients + ' recipient(s).'); }, function (e) { el.disabled = false; toast(e.message, 'error'); });
      },
      'export-csv': function (d, el) {
        el.disabled = true;
        call('exportRange', reportParams()).then(function (r) { el.disabled = false; download(r.filename, r.csv); toast('Exported ' + r.rows + ' rows.'); }, function (e) { el.disabled = false; toast(e.message, 'error'); });
      },
      'export-xlsx': function (d, el) {
        el.disabled = true;
        var p = reportParams();
        p.format = 'xlsx';
        call('exportRange', p).then(function (r) {
          el.disabled = false;
          document.getElementById('report-out').innerHTML = '<div class="lp-card p-3 text-sm">Excel file with ' + r.rows + ' rows: <a class="text-teal-700 underline" target="_blank" href="' + esc(r.file.url) + '">' + esc(r.file.name) + '</a></div>';
        }, function (e) { el.disabled = false; toast(e.message, 'error'); });
      },
      'export-drive': function (d, el) {
        el.disabled = true;
        var p = reportParams();
        p.saveToDrive = true;
        call('exportRange', p).then(function (r) {
          el.disabled = false;
          document.getElementById('report-out').innerHTML = '<div class="lp-card p-3 text-sm">Saved ' + r.rows + ' rows: <a class="text-teal-700 underline" target="_blank" href="' + esc(r.file.url) + '">' + esc(r.file.name) + '</a></div>';
        }, function (e) { el.disabled = false; toast(e.message, 'error'); });
      },

      'use-location': function () {
        var help = document.getElementById('loc-help');
        if (!navigator.geolocation) return toast('This browser cannot share location.', 'error');
        help.textContent = 'Getting location…';
        navigator.geolocation.getCurrentPosition(function (p) {
          document.getElementById('f-lat').value = p.coords.latitude.toFixed(6);
          document.getElementById('f-lng').value = p.coords.longitude.toFixed(6);
          help.textContent = 'Filled from this device (accuracy ±' + Math.round(p.coords.accuracy) + ' m). Save to apply.' + (p.coords.accuracy > 20 ? ' Accuracy is poor; try again near a window.' : '');
        }, function (e) { help.textContent = 'Could not get a location: ' + e.message; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
      },
      'new-lab': function () {
        var cfg = S.sections.settings.cfg;
        cfg.labs.push({ lab_id: '', name: '', lat: '', lng: '', radius_m: 20, open_time: '08:00', close_time: '20:00', open_days: 'MON,TUE,WED,THU,FRI,SAT', accuracy_limit_m: 30, amber_margin_m: 30, speed_flag_kmh: 25, speed_block_kmh: 200, qr_rotate_sec: 8, grace_min: 15, map_cols: 8, map_rows: 5, incharge_email: '', active: true });
        S.lab = '';
        paintSection('settings');
      },
      'project-edit': function (d) {
        var p = d.id ? (S.myProjects || []).filter(function (x) { return x.project_id === d.id; })[0] : null;
        openModal(p ? 'Edit project' : 'New project', projectForm(p), function (v) {
          v.lab_id = studentLab() || S.lab;
          return call('projectSave', v).then(function () { toast('Project saved.'); reloadVisible(); });
        });
      },
      'project-complete': function (d) {
        openModal('Submit the project outcome', '<p class="text-sm text-slate-600">What came out of this project? Results, what was built, what you learned.</p>' +
          field('Outcome', '<textarea class="lp-input" name="outcome" rows="4" required></textarea>') +
          field('Link to code, report or video (optional)', input('outcome_link', '', 'placeholder="https://github.com/…"')) +
          field('Status', select('status', [['COMPLETED', 'Completed'], ['DROPPED', 'Stopped / dropped']], 'COMPLETED')), function (v) {
          v.project_id = d.id;
          return call('projectComplete', v).then(function () { toast('Outcome saved.'); reloadVisible(); });
        }, 'Save outcome');
      },
      'project-open': function (d) {
        call('projectDetail', { projectId: d.id }).then(function (r) {
          var p = r.project;
          openModal(p.title, '<div class="text-sm text-slate-600">' + esc(p.owner_name || p.owner_email) + ' · ' + esc(p.start_date + ' → ' + p.end_date) + ' · ' + p.hours + ' h · ' + projectStatus(p) + '</div>' +
            (p.description ? '<p class="text-sm">' + esc(p.description) + '</p>' : '') +
            (p.outcome ? '<p class="text-sm"><b>Outcome:</b> ' + esc(p.outcome) + '</p>' : '') +
            '<h4 class="font-semibold text-sm mt-2">Work log</h4>' + (r.log.length ? table(['Date', 'Who', 'System', 'Hours', 'Note'], r.log.map(function (x) {
              return [esc(x.date), esc(x.name), esc(x.system), x.hours, esc(x.note || '')];
            })) : empty('No lab time logged yet.')));
        }, function (e) { toast(e.message, 'error'); });
      },
      'student-toggle': function (d) {
        var removing = !!d.active;
        if (!removing) {
          return call('manageStudent', { email: d.email, active: true }).then(function () { toast('Re-activated.'); loadSection('students'); }, function (e) { toast(e.message, 'error'); });
        }
        openModal('Remove ' + d.email + '?', '<p class="text-sm text-slate-600">They will no longer be able to sign in. Their visits stay in reports.</p>' + field('Reason', input('reason', '', 'required')), function (v) {
          return call('manageStudent', { email: d.email, active: false, reason: v.reason }).then(function () { toast('Removed.'); loadSection('students'); });
        }, 'Remove');
      },
      'run-job': function (d, el) {
        el.disabled = true;
        call('runJob', { job: d.job }).then(function (r) { el.disabled = false; toast('Done: ' + JSON.stringify(r).slice(0, 120)); }, function (e) { el.disabled = false; toast(e.message, 'error'); });
      },
      'install-triggers': function (d, el) {
        el.disabled = true;
        call('installTriggers').then(function () { el.disabled = false; toast('Background triggers installed.'); }, function (e) { el.disabled = false; toast(e.message, 'error'); });
      }
    };

    var tipEl = null;
    function hideTip() { if (tipEl) { tipEl.remove(); tipEl = null; } }
    document.addEventListener('mouseover', function (ev) {
      var t = ev.target && ev.target.closest ? ev.target.closest('[data-tip]') : null;
      if (!t) return hideTip();
      if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'lp-tip'; document.body.appendChild(tipEl); }
      tipEl.textContent = t.getAttribute('data-tip');
    });
    document.addEventListener('mousemove', function (ev) {
      if (!tipEl) return;
      var x = Math.min(ev.clientX + 12, window.innerWidth - tipEl.offsetWidth - 8);
      tipEl.style.left = x + 'px';
      tipEl.style.top = (ev.clientY - tipEl.offsetHeight - 10) + 'px';
    });
    document.addEventListener('scroll', hideTip, true);

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-act]');
      if (!el) return;
      var fn = ACTIONS[el.getAttribute('data-act')];
      if (!fn) return;
      if (el.tagName === 'BUTTON' && el.type !== 'submit') ev.preventDefault();
      fn(el.dataset, el, ev);
    });

    document.addEventListener('input', function (ev) {
      var bind = ev.target.getAttribute('data-bind');
      if (bind && S.checkin) {
        S.checkin.reason[bind] = ev.target.value;
        paintSubmit();
      }
    });

    /** In the reserve form: show what is already booked for the chosen item and day. */
    function showSchedule() {
      var f = document.getElementById('modal-form');
      var info = document.getElementById('slot-info');
      if (!f || !info) return;
      var asset = f.querySelector('[name=assetId]').value;
      var date = f.querySelector('[name=date]').value;
      if (!asset || !date) return;
      info.textContent = 'Checking the schedule…';
      call('assetSchedule', { assetId: asset, date: date }).then(function (list) {
        info.innerHTML = list.length ? 'Already reserved that day: ' + list.map(function (b) {
          return '<b>' + esc(fmtTime(b.start_at) + '–' + fmtTime(b.end_at)) + '</b>' + (b.mine ? ' (you)' : '') + (b.status === 'WAITLIST' ? ' (queue)' : '');
        }).join(', ') : 'Free all day.';
      }, function () { info.textContent = ''; });
    }

    document.addEventListener('change', function (ev) {
      var t = ev.target;
      if (t.hasAttribute('data-schedule')) return showSchedule();
      if (t.id === 'dev-pick') {
        var em = document.querySelector('#auth-email [name=email]');
        if (em && t.value) { em.value = t.value; em.focus(); }
        return;
      }
      if (t.id === 'lab-select') {
        S.lab = t.value;
        S.roster.sessionId = null;
        S.occ = null;
        render();
        refreshOcc();
      } else if (t.id === 'roster-date') {
        S.roster.date = t.value;
        loadSection('roster');
      } else if (t.hasAttribute('data-user-role') || t.hasAttribute('data-user-active')) {
        var email = t.getAttribute('data-user-role') || t.getAttribute('data-user-active');
        var row = t.closest('tr');
        var roleSel = row.querySelector('[data-user-role]');
        var active = row.querySelector('[data-user-active]');
        call('saveUser', { email: email, role: roleSel.value, active: active.checked }).then(function () { toast('Updated ' + email + '.'); }, function (e) { toast(e.message, 'error'); loadSection('people'); });
      }
    });

    document.addEventListener('submit', function (ev) {
      var f = ev.target;
      if (f.id === 'auth-email') {
        ev.preventDefault();
        submitEmail(f);
      } else if (f.id === 'lab-form') {
        ev.preventDefault();
        call('saveLab', formData(f)).then(function (lab) {
          toast('Lab settings saved.');
          S.lab = lab.lab_id;
          return call('bootstrap').then(function (init) { S.init = init; render(); });
        }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'global-form') {
        ev.preventDefault();
        call('saveGlobal', formData(f)).then(function () { toast('System settings saved.'); }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'perm-form') {
        ev.preventDefault();
        var overrides = {};
        Array.prototype.forEach.call(f.querySelectorAll('input[type=checkbox]:checked:not(:disabled)'), function (cb) {
          var p = cb.name.split('|');
          (overrides[p[0]] = overrides[p[0]] || []).push(p[1]);
        });
        call('savePermissions', { overrides: overrides }).then(function () { toast('Permissions saved.'); }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'lookup-student') {
        ev.preventDefault();
        var qv = f.querySelector('[name=q]').value;
        S.lookupQ = qv;
        var out1 = document.getElementById('lookup-student-out');
        out1.innerHTML = skeleton(120);
        call('lookupStudent', { q: qv }).then(function (r) { out1.innerHTML = htmlStudentLookup(r); }, function (e) { out1.innerHTML = errorBox(e); });
      } else if (f.id === 'lookup-asset') {
        ev.preventDefault();
        var av = f.querySelector('[name=assetId]').value;
        S.lookupAsset = av;
        var out2 = document.getElementById('lookup-asset-out');
        out2.innerHTML = skeleton(120);
        call('lookupAsset', { assetId: av }).then(function (r) { out2.innerHTML = htmlAssetLookup(r); }, function (e) { out2.innerHTML = errorBox(e); });
      } else if (f.id === 'student-add') {
        ev.preventDefault();
        call('manageStudent', formData(f)).then(function () { toast('Student added.'); loadSection('students'); }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'user-add') {
        ev.preventDefault();
        call('saveUser', formData(f)).then(function () { toast('Saved.'); loadSection('people'); }, function (e) { toast(e.message, 'error'); });
      } else if (f.id === 'audit-form') {
        ev.preventDefault();
        S.auditFilter = formData(f);
        render();
      }
    });

    /* ================= live refresh (FR-14) ================= */

    function paintOcc() {
      var el = document.getElementById('occ-pill');
      if (el) el.innerHTML = occPill();
    }
    function refreshOcc() {
      var lab = role() === 'STUDENT' ? studentLab() : S.lab;
      if (!lab) return;
      call('occupancy', { labId: lab }).then(function (r) { S.occ = r.occupancy; S.occPending = r.pending; paintOcc(); }, function () {});
    }
    function tick() {
      if (document.hidden || S.checkin || !S.init || !S.init.me.registered) return;
      refreshOcc();
      S.active.forEach(function (id) {
        if (S.sections[id] && S.sections[id].live) loadSection(id);
      });
    }

    function afterInit() {
      S.lab = S.lab || (S.init.labs[0] && S.init.labs[0].lab_id) || null;
      if (S.page === 'checkin' && !S.init.me.registered) { render(); return; }
      if (BOOT.view === 'checkin' && BOOT.claim && S.init.me.registered && !S._claimShown) {
        S._claimShown = true;
        startCheckin(BOOT.claim);
      } else {
        render();
      }
      refreshOcc();
    }

    if (!S.init) {
      // No usable identity: public pages still work; dashboard links lead to the login page.
      if (!PUBLIC_PAGES[S.page]) S.page = 'login';
      render();
    } else {
      afterInit();
      setInterval(tick, Math.max(5000, Math.min(10000, S.init.pollMs || 8000)));
      document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    }
  })();
</script>
