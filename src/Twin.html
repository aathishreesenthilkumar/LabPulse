<style>
  /* ---------- 3D lab twin (Live → 3D view) ---------- */
  .lp-twin { position: relative; height: min(72vh, 680px); min-height: 420px; border: 1px solid var(--lp-line, #e6e3da); border-radius: 18px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #fbfaf6 0%, #efece4 100%); }
  .lp-twin canvas { display: block; width: 100%; height: 100%; outline: none; }
  .lp-twin-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #5b5a55; font-size: 14px; }
  .lp-twin-bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .lp-twin-bar > * { pointer-events: auto; }
  .lp-twin-find { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .92); border: 1px solid #e0ddd3; border-radius: 999px; padding: 4px 4px 4px 12px; box-shadow: 0 4px 18px -10px rgba(0, 0, 0, .3); }
  .lp-twin-find input { border: 0; outline: none; background: transparent; font-size: 13.5px; width: 13rem; font-family: 'Geist Mono', ui-monospace, monospace; text-transform: uppercase; }
  .lp-twin-find input::placeholder { text-transform: none; font-family: inherit; }
  .lp-twin-find button { border-radius: 999px; background: #121212; color: #fff; font-size: 12.5px; font-weight: 600; padding: 5px 12px; }
  .lp-twin-chip { background: rgba(255, 255, 255, .92); border: 1px solid #e0ddd3; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .lp-twin-chip i { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  .lp-twin-card { position: absolute; left: 12px; bottom: 12px; width: min(21rem, calc(100% - 24px)); background: #fff; border: 1px solid #e0ddd3; border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 16px 40px -18px rgba(0, 0, 0, .35); font-size: 13px; line-height: 1.5; }
  .lp-twin-card b.reg { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; }
  .lp-twin-card .x { position: absolute; top: 8px; right: 10px; font-size: 18px; color: #8a877e; }
  .lp-twin-note { position: absolute; right: 12px; bottom: 12px; font-size: 11.5px; color: #77746b; background: rgba(255, 255, 255, .75); padding: 4px 9px; border-radius: 8px; max-width: 22rem; text-align: right; }
  .lp-twin-help { font-size: 11.5px; color: #77746b; }
  @media (max-width: 640px) { .lp-twin { height: 64vh; } .lp-twin-find input { width: 9.5rem; } .lp-twin-note { display: none; } }
</style>
<script>
  /**
   * LabPulse 3D twin: the lab drawn in 3D with a figure for every person checked in and
   * their register number floating above their head. Figures sit at the system they chose
   * at check-in, walk out of the door when GPS live mode reports them outside, fade when
   * they are not seen, and walk back when they return. Positions come from LabPulse
   * records, not indoor tracking.
   *
   * API: LabTwin.mount(host, {onPick}) -> Promise · update(data) · find(text) · dispose()
   */
  var LabTwin = (function () {
    var THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    var CELL = 2.4; // metres per floor-plan cell
    var COLORS = { IN: 0x1f9d7a, OUT: 0xdc3b3b, NOT_SEEN: 0x9a978f, PENDING: 0xd99a1e, NOT_WATCHED: 0x3b6fd8 };
    var CSS = { IN: '#1f9d7a', OUT: '#dc3b3b', NOT_SEEN: '#8a877e', PENDING: '#c98a10', NOT_WATCHED: '#3b6fd8' };
    var ASSET_LED = { AVAILABLE: 0x3fbf9b, IN_USE: 0x3b82f6, ISSUED: 0x3b82f6, RESERVED: 0xf2a93b, UNAVAILABLE: 0x9a978f };

    var loading = null;
    var T = null; // THREE
    /** Scene colours for the current day/night theme. */
    function palette() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      return dark
        ? { floor: 0x1f2723, grid1: 0x34403a, grid2: 0x29332e, outside: 0x151b18, outText: '#ff8a80', wall: 0x2b3631, wallOpacity: 0.9, title: '#e8efeb', desk: 0x3b4741, leg: 0x5d6a64, label: '#b9c6bf' }
        : { floor: 0xf4f1ea, grid1: 0xd9d4c7, grid2: 0xe7e3d8, outside: 0xd9d3c4, outText: '#9b2c2c', wall: 0xffffff, wallOpacity: 0.88, title: '#121212', desk: 0xe6dfcf, leg: 0x8c877b, label: '#3d3d3a' };
    }
    var st = null; // current scene state

    function loadScript(src) {
      return new Promise(function (ok, fail) {
        var s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = ok;
        s.onerror = function () { fail(new Error('Could not load ' + src)); };
        document.head.appendChild(s);
      });
    }
    function loadThree() {
      if (window.THREE) return Promise.resolve(window.THREE);
      if (!loading) {
        loading = loadScript(THREE_URL).then(function () { return window.THREE; });
        loading.catch(function () { loading = null; });
      }
      return loading;
    }

    /**
     * Small built-in camera control (one less script to download): drag to turn, wheel or
     * pinch to zoom, with gentle easing. Works with mouse, touch and pen.
     */
    function Orbit(camera, el) {
      var self = this;
      self.target = new T.Vector3();
      self.minDistance = 4; self.maxDistance = 48; self.minPolar = 0.18; self.maxPolar = 1.32;
      self.onStart = null;
      var dTheta = 0, dPhi = 0, zoom = 1, pts = {}, pinch = 0;
      el.style.touchAction = 'none';
      var count = function () { return Object.keys(pts).length; };
      var spread = function () { var k = Object.keys(pts); if (k.length < 2) return 0; var a = pts[k[0]], b = pts[k[1]]; return Math.hypot(a.x - b.x, a.y - b.y); };
      el.addEventListener('pointerdown', function (e) {
        pts[e.pointerId] = { x: e.clientX, y: e.clientY };
        pinch = spread();
        if (self.onStart) self.onStart();
      });
      el.addEventListener('pointermove', function (e) {
        var p = pts[e.pointerId];
        if (!p) return;
        if (count() === 1) { dTheta -= (e.clientX - p.x) * 0.007; dPhi -= (e.clientY - p.y) * 0.007; }
        p.x = e.clientX; p.y = e.clientY;
        if (count() === 2) { var d = spread(); if (pinch && d) zoom *= pinch / d; pinch = d; }
      });
      var end = function (e) { delete pts[e.pointerId]; pinch = spread(); };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('pointerleave', end);
      el.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (self.onStart) self.onStart();
        zoom *= Math.exp(Math.max(-60, Math.min(60, e.deltaY)) * 0.004);
      }, { passive: false });
      self.update = function () {
        var off = camera.position.clone().sub(self.target);
        var r = off.length() || 1;
        var theta = Math.atan2(off.x, off.z);
        var phi = Math.acos(Math.max(-1, Math.min(1, off.y / r)));
        theta += dTheta * 0.3; phi += dPhi * 0.3; dTheta *= 0.7; dPhi *= 0.7;
        r *= Math.pow(zoom, 0.3); zoom = Math.pow(zoom, 0.7);
        phi = Math.max(self.minPolar, Math.min(self.maxPolar, phi));
        r = Math.max(self.minDistance, Math.min(self.maxDistance, r));
        off.set(r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.cos(theta));
        camera.position.copy(self.target).add(off);
        camera.lookAt(self.target);
      };
    }
    /** Checked once per page: each check makes a WebGL context, and browsers cap how many may exist. */
    var webglKnown = null;
    function webglOk() {
      if (webglKnown !== null) return webglKnown;
      try {
        var c = document.createElement('canvas');
        var gl = window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'));
        webglKnown = !!gl;
        var lose = gl && gl.getExtension && gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext(); // release the test context straight away
      } catch (e) { webglKnown = false; }
      return webglKnown;
    }

    /* ---------- text sprites (register number tags, labels) ---------- */
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function tagTexture(title, sub, color) {
      var c = document.createElement('canvas');
      c.width = 512; c.height = 160;
      var g = c.getContext('2d');
      g.clearRect(0, 0, 512, 160);
      g.fillStyle = 'rgba(255,255,255,0.96)';
      roundRect(g, 8, 8, 496, 120, 30); g.fill();
      g.lineWidth = 6; g.strokeStyle = color; roundRect(g, 8, 8, 496, 120, 30); g.stroke();
      g.fillStyle = color; g.beginPath(); g.moveTo(236, 128); g.lineTo(256, 154); g.lineTo(276, 128); g.fill(); // pointer to the head
      g.fillStyle = color; g.beginPath(); g.arc(50, 68, 13, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#121212'; g.font = '700 46px "Geist Mono", Consolas, monospace'; g.textBaseline = 'middle';
      g.fillText(fit(g, title, 410), 78, sub ? 52 : 68);
      if (sub) { g.fillStyle = '#5b5a55'; g.font = '500 28px "Geist", system-ui, sans-serif'; g.fillText(fit(g, sub, 410), 78, 96); }
      var t = new T.CanvasTexture(c);
      t.anisotropy = 4;
      return t;
    }
    function labelTexture(text, size, color, bg) {
      var c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      var g = c.getContext('2d');
      if (bg) { g.fillStyle = bg; roundRect(g, 4, 24, 504, 80, 20); g.fill(); }
      g.fillStyle = color; g.font = '700 ' + size + 'px "Geist Mono", Consolas, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(text, 256, 64);
      return new T.CanvasTexture(c);
    }
    function fit(g, text, max) {
      text = String(text || '');
      if (g.measureText(text).width <= max) return text;
      while (text.length > 1 && g.measureText(text + '…').width > max) text = text.slice(0, -1);
      return text + '…';
    }
    function sprite(texture, w, h) {
      var m = new T.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
      var s = new T.Sprite(m);
      s.scale.set(w, h, 1);
      return s;
    }
    function hhmm(ms) {
      if (!ms) return '';
      try { return new Date(ms).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' }); } catch (e) { return ''; }
    }

    /* ---------- room ---------- */
    function buildRoom(data) {
      var cols = Math.max(2, data.cols || 8), rows = Math.max(2, data.rows || 5);
      var W = cols * CELL, D = rows * CELL;
      var room = new T.Group();
      var x0 = -W / 2, z0 = -D / 2;
      st.dim = { cols: cols, rows: rows, W: W, D: D, x0: x0, z0: z0 };

      var pal = palette();
      var floor = new T.Mesh(new T.BoxGeometry(W + 0.6, 0.2, D + 0.6), new T.MeshStandardMaterial({ color: pal.floor, roughness: 0.95 }));
      floor.position.y = -0.1; floor.receiveShadow = true; room.add(floor);
      var grid = new T.GridHelper(Math.max(W, D), Math.max(cols, rows), pal.grid1, pal.grid2);
      grid.position.y = 0.002; grid.scale.set(W / Math.max(W, D), 1, D / Math.max(W, D)); room.add(grid);

      // Outside strip in front of the door.
      var outside = new T.Mesh(new T.BoxGeometry(W + 6, 0.12, 5.2), new T.MeshStandardMaterial({ color: pal.outside, roughness: 1 }));
      outside.position.set(0, -0.14, D / 2 + 3.2); outside.receiveShadow = true; room.add(outside);
      var outLabel = new T.Mesh(new T.PlaneGeometry(5, 1.25), new T.MeshBasicMaterial({ map: labelTexture('OUTSIDE THE LAB', 56, pal.outText), transparent: true }));
      outLabel.rotation.x = -Math.PI / 2; outLabel.position.set(-W / 2 + 3.2, -0.07, D / 2 + 5.2); room.add(outLabel);

      // Walls: cut-away height so you can see inside; a door gap in the front wall.
      var wallMat = new T.MeshStandardMaterial({ color: pal.wall, roughness: 0.9, transparent: true, opacity: pal.wallOpacity });
      var H = 1.1, th = 0.14, door = 2.2;
      var wall = function (w, d, x, z) { var m = new T.Mesh(new T.BoxGeometry(w, H, d), wallMat); m.position.set(x, H / 2, z); m.castShadow = true; m.receiveShadow = true; room.add(m); };
      wall(W + th * 2, th, 0, -D / 2 - th / 2);
      wall(th, D, -W / 2 - th / 2, 0);
      wall(th, D, W / 2 + th / 2, 0);
      var side = (W - door) / 2;
      wall(side + th, th, -W / 2 + side / 2 - th / 2, D / 2 + th / 2);
      wall(side + th, th, W / 2 - side / 2 + th / 2, D / 2 + th / 2);
      st.door = { inside: new T.Vector3(0, 0, D / 2 - 0.9), outside: new T.Vector3(0, 0, D / 2 + 1.4) };
      var doorMat = new T.MeshStandardMaterial({ color: 0x0e7a68, roughness: 0.6 });
      var post = function (x) { var m = new T.Mesh(new T.BoxGeometry(0.12, 2.1, 0.2), doorMat); m.position.set(x, 1.05, D / 2 + th / 2); m.castShadow = true; room.add(m); };
      post(-door / 2); post(door / 2);
      var lintel = new T.Mesh(new T.BoxGeometry(door + 0.12, 0.12, 0.2), doorMat); lintel.position.set(0, 2.1, D / 2 + th / 2); room.add(lintel);
      var doorSign = sprite(labelTexture('DOOR', 44, '#ffffff', '#0e7a68'), 1.3, 0.33); doorSign.position.set(0, 2.45, D / 2 + 0.1); room.add(doorSign);

      var title = sprite(labelTexture(String(data.name || 'Lab').toUpperCase(), 40, pal.title), 6, 1.5);
      title.position.set(0, 1.9, -D / 2 - 0.2); room.add(title);
      st.scene.add(room);
      st.room = room;
    }
    function cellCenter(x, y) {
      var d = st.dim;
      return new T.Vector3(d.x0 + (x + 0.5) * CELL, 0, d.z0 + (y + 0.5) * CELL);
    }

    /* ---------- desks and equipment ---------- */
    function buildAssets(list) {
      if (st.assetGroup) { st.scene.remove(st.assetGroup); }
      var g = new T.Group();
      st.seats = {};
      st.used = {};
      var pal = palette();
      var deskMat = new T.MeshStandardMaterial({ color: pal.desk, roughness: 0.8 });
      var legMat = new T.MeshStandardMaterial({ color: pal.leg, roughness: 0.7 });
      var dark = new T.MeshStandardMaterial({ color: 0x24282b, roughness: 0.5 });
      list.forEach(function (a) {
        if (a.x >= st.dim.cols || a.y >= st.dim.rows) return;
        var c = cellCenter(a.x, a.y);
        st.used[a.x + ',' + a.y] = true;
        var desk = new T.Group();
        var top = new T.Mesh(new T.BoxGeometry(1.6, 0.08, 0.85), deskMat); top.position.y = 0.76; top.castShadow = true; top.receiveShadow = true; desk.add(top);
        [[-0.72, -0.34], [0.72, -0.34], [-0.72, 0.34], [0.72, 0.34]].forEach(function (p) {
          var leg = new T.Mesh(new T.BoxGeometry(0.06, 0.74, 0.06), legMat); leg.position.set(p[0], 0.37, p[1]); desk.add(leg);
        });
        var kind = (a.category + ' ' + a.type + ' ' + a.name).toLowerCase();
        var item;
        if (/print/.test(kind)) { item = new T.Mesh(new T.BoxGeometry(0.62, 0.62, 0.55), new T.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.4 })); item.position.y = 1.11; }
        else if (/drone/.test(kind)) { item = new T.Mesh(new T.CylinderGeometry(0.34, 0.34, 0.08, 4), dark); item.rotation.y = Math.PI / 4; item.position.y = 0.84; }
        else if (/pc|gpu|rtx|a100|workstation|comput/.test(kind)) {
          item = new T.Group();
          var screen = new T.Mesh(new T.BoxGeometry(0.9, 0.52, 0.05), dark); screen.position.set(0, 1.12, -0.22); item.add(screen);
          var glow = new T.Mesh(new T.PlaneGeometry(0.82, 0.44), new T.MeshBasicMaterial({ color: a.status === 'IN_USE' ? 0x8fb8ff : 0x3a4148 })); glow.position.set(0, 1.12, -0.194); item.add(glow);
          var stand = new T.Mesh(new T.BoxGeometry(0.08, 0.3, 0.08), dark); stand.position.set(0, 0.92, -0.22); item.add(stand);
        } else { item = new T.Mesh(new T.BoxGeometry(0.3, 0.12, 0.22), new T.MeshStandardMaterial({ color: 0x2f6b5c, roughness: 0.5 })); item.position.y = 0.86; }
        item.traverse ? item.traverse(function (m) { if (m.isMesh) m.castShadow = true; }) : null;
        desk.add(item);
        var led = new T.Mesh(new T.SphereGeometry(0.07, 12, 12), new T.MeshBasicMaterial({ color: ASSET_LED[a.status] || 0x9a978f }));
        led.position.set(0.66, 0.86, 0.3); desk.add(led);
        var label = sprite(labelTexture(a.asset_id, 54, pal.label), 1.1, 0.28); label.position.set(0, 0.2, 0.62); desk.add(label);
        desk.position.copy(c);
        desk.userData.asset = a;
        g.add(desk);
        st.seats[a.asset_id] = new T.Vector3(c.x, 0, c.z + 0.95); // where the person stands/sits, facing the desk
      });
      st.scene.add(g);
      st.assetGroup = g;
      // Free floor cells for people without a placed system ("open bench").
      st.free = [];
      for (var y = st.dim.rows - 1; y >= 0; y--) for (var x = 0; x < st.dim.cols; x++) if (!st.used[x + ',' + y]) st.free.push(cellCenter(x, y));
    }

    /* ---------- people ---------- */
    function stateOf(p) {
      if (p.state === 'OUT' || p.state === 'NOT_SEEN') return p.state;
      if (p.review_status === 'PENDING') return 'PENDING';
      return p.state === 'IN' ? 'IN' : 'NOT_WATCHED';
    }
    function tagFor(p, s) {
      var sub = s === 'OUT' ? 'Out since ' + hhmm(p.state_since) : s === 'NOT_SEEN' ? 'Not seen since ' + hhmm(p.state_since)
        : s === 'PENDING' ? 'Awaiting review' : (p.system ? p.system.replace(/\s*\(.*\)$/, '') : 'Open bench');
      return tagTexture(p.reg_no, sub, CSS[s]);
    }
    function makeAvatar(p) {
      var g = new T.Group();
      var mat = new T.MeshStandardMaterial({ color: COLORS.IN, roughness: 0.55, transparent: true });
      var skin = new T.MeshStandardMaterial({ color: 0xe8c4a2, roughness: 0.7, transparent: true });
      var legs = new T.Mesh(new T.CylinderGeometry(0.16, 0.14, 0.62, 16), new T.MeshStandardMaterial({ color: 0x2f3437, roughness: 0.8, transparent: true }));
      legs.position.y = 0.31; legs.castShadow = true; g.add(legs);
      var body = new T.Mesh(new T.CylinderGeometry(0.22, 0.27, 0.72, 20), mat); body.position.y = 0.98; body.castShadow = true; g.add(body);
      var shoulders = new T.Mesh(new T.SphereGeometry(0.22, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat); shoulders.position.y = 1.33; g.add(shoulders);
      var head = new T.Mesh(new T.SphereGeometry(0.19, 24, 18), skin); head.position.y = 1.62; head.castShadow = true; g.add(head);
      var shadow = new T.Mesh(new T.CircleGeometry(0.36, 24), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.16, depthWrite: false }));
      shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.01; g.add(shadow);
      var ring = new T.Mesh(new T.RingGeometry(0.45, 0.58, 40), new T.MeshBasicMaterial({ color: 0x121212, transparent: true, opacity: 0, side: T.DoubleSide, depthWrite: false }));
      ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; g.add(ring);
      var tag = sprite(tagFor(p, 'IN'), 2.5, 0.78); tag.position.y = 2.45; g.add(tag);
      g.userData = { person: p, mats: [mat, skin, legs.material], body: mat, tag: tag, ring: ring, path: [], phase: Math.random() * 6 };
      g.traverse(function (m) { m.userData.owner = g; });
      return g;
    }
    function targetFor(p, s, i, outIndex) {
      if (s === 'OUT') {
        var col = outIndex % 8, row = Math.floor(outIndex / 8);
        return new T.Vector3(-3.15 + col * 0.9, 0, st.dim.D / 2 + 2.6 + row * 1.0);
      }
      if (p.system_id && st.seats[p.system_id]) return st.seats[p.system_id].clone();
      var spot = st.free.length ? st.free[i % st.free.length] : new T.Vector3(0, 0, 0);
      var crowd = Math.floor(i / Math.max(1, st.free.length));
      return new T.Vector3(spot.x + (crowd % 3 - 1) * 0.7, 0, spot.z + Math.floor(crowd / 3) * 0.7);
    }
    function outsideRoom(v) { return v.z > st.dim.D / 2 + 0.3; }
    function routeTo(av, target) {
      var from = av.position.clone();
      var path = [];
      var a = outsideRoom(from), b = outsideRoom(target);
      if (a !== b) { // go through the door
        if (a) { path.push(st.door.outside.clone()); path.push(st.door.inside.clone()); }
        else { path.push(st.door.inside.clone()); path.push(st.door.outside.clone()); }
      }
      path.push(target.clone());
      av.userData.path = path;
    }
    function applyState(av, p, s) {
      var u = av.userData;
      var faded = s === 'NOT_SEEN';
      u.body.color.setHex(COLORS[s] || COLORS.IN);
      u.mats.forEach(function (m) { m.opacity = faded ? 0.55 : 1; });
      if (u.tag.material.map) u.tag.material.map.dispose();
      u.tag.material.map = tagFor(p, s);
      u.tag.material.needsUpdate = true;
      u.tag.material.opacity = faded ? 0.85 : 1;
      u.state = s;
      u.person = p;
    }

    function update(data) {
      if (!st) return;
      st.data = data;
      if (!st.room) buildRoom(data);
      var sig = JSON.stringify(data.assets);
      if (sig !== st.assetSig) { buildAssets(data.assets || []); st.assetSig = sig; }
      var seen = {};
      var outIndex = 0;
      (data.people || []).forEach(function (p, i) {
        var s = stateOf(p);
        var av = st.people[p.visit_id];
        var target = targetFor(p, s, i, s === 'OUT' ? outIndex++ : 0);
        if (!av) {
          av = makeAvatar(p);
          // New arrivals walk in through the door.
          av.position.copy(outsideRoom(target) ? target : st.door.outside);
          st.scene.add(av);
          st.people[p.visit_id] = av;
          applyState(av, p, s);
          routeTo(av, target);
        } else {
          if (av.userData.state !== s || JSON.stringify(av.userData.person) !== JSON.stringify(p)) applyState(av, p, s);
          var last = av.userData.goal;
          if (!last || last.distanceTo(target) > 0.05) routeTo(av, target);
        }
        av.userData.goal = target;
        seen[p.visit_id] = true;
      });
      Object.keys(st.people).forEach(function (id) {
        if (seen[id]) return;
        var av = st.people[id]; // checked out: walk out and disappear
        if (!av.userData.leaving) { av.userData.leaving = true; routeTo(av, new T.Vector3(0, 0, st.dim.D / 2 + 7)); }
      });
      if (st.focusId && !seen[st.focusId]) st.focusId = null;
      st.counts = (data.people || []).reduce(function (c, p) { c[stateOf(p)] = (c[stateOf(p)] || 0) + 1; return c; }, {});
      if (st.onCounts) st.onCounts(st.counts);
    }

    /* ---------- loop ---------- */
    function tick() {
      if (!st) return;
      if (!st.host.isConnected) return dispose();
      st.raf = requestAnimationFrame(tick);
      var dt = Math.min(0.05, st.clock.getDelta());
      var t = st.clock.elapsedTime;
      Object.keys(st.people).forEach(function (id) {
        var av = st.people[id], u = av.userData;
        var walking = false;
        if (u.path.length) {
          var next = u.path[0];
          var d = next.clone().sub(av.position); d.y = 0;
          var dist = d.length();
          var step = 2.2 * dt;
          if (dist <= step) { av.position.x = next.x; av.position.z = next.z; u.path.shift(); }
          else { d.normalize(); av.position.x += d.x * step; av.position.z += d.z * step; av.rotation.y = Math.atan2(d.x, d.z); walking = true; }
        } else if (u.leaving) {
          st.scene.remove(av); delete st.people[id]; return;
        } else {
          // Settled: face the desk (inside) or the lab (outside).
          var want = outsideRoom(av.position) ? Math.PI : Math.PI;
          av.rotation.y += (want - av.rotation.y) * Math.min(1, dt * 4);
        }
        av.position.y = walking ? Math.abs(Math.sin((t + u.phase) * 9)) * 0.06 : Math.sin((t + u.phase) * 1.6) * 0.012;
        var focus = st.focusId === id;
        u.ring.material.opacity = focus ? 0.55 + Math.sin(t * 5) * 0.3 : 0;
        var sc = focus ? 1 + Math.sin(t * 5) * 0.08 : 1;
        u.ring.scale.set(sc, sc, sc);
      });
      if (st.fly) {
        var k = Math.min(1, dt * 3);
        st.controls.target.lerp(st.fly.target, k);
        st.camera.position.lerp(st.fly.pos, k);
        if (st.camera.position.distanceTo(st.fly.pos) < 0.05) st.fly = null;
      }
      st.controls.update();
      st.renderer.render(st.scene, st.camera);
    }
    function resize() {
      if (!st) return;
      var w = st.host.clientWidth, h = st.host.clientHeight;
      if (!w || !h) return;
      st.camera.aspect = w / h;
      st.camera.updateProjectionMatrix();
      st.renderer.setSize(w, h, false);
    }
    function homeView() {
      var d = st.dim || { W: 19, D: 12 };
      var r = Math.max(d.W, d.D);
      st.fly = { target: new T.Vector3(0, 0, d.D * 0.3), pos: new T.Vector3(0, r * 0.78, d.D / 2 + r * 0.66) };
    }

    function pickAt(ev) {
      var rect = st.renderer.domElement.getBoundingClientRect();
      var m = new T.Vector2(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
      var ray = new T.Raycaster();
      ray.setFromCamera(m, st.camera);
      var objs = [];
      Object.keys(st.people).forEach(function (id) { st.people[id].traverse(function (o) { if (o.isMesh || o.isSprite) objs.push(o); }); });
      var hit = ray.intersectObjects(objs, false)[0];
      if (!hit) return;
      var av = hit.object.userData.owner;
      if (!av) return;
      focusAvatar(av);
      if (st.onPick) st.onPick(av.userData.person, stateOf(av.userData.person));
    }
    function focusAvatar(av) {
      st.focusId = av.userData.person.visit_id;
      var at = (av.userData.path.length ? av.userData.path[av.userData.path.length - 1] : av.position).clone();
      st.fly = { target: new T.Vector3(at.x, 1, at.z), pos: new T.Vector3(at.x + 3.2, 5.2, at.z + 6.2) };
    }

    function find(text) {
      if (!st) return null;
      var q = String(text || '').trim().toLowerCase();
      if (!q) { st.focusId = null; homeView(); return null; }
      var ids = Object.keys(st.people).filter(function (id) {
        var p = st.people[id].userData.person;
        return !st.people[id].userData.leaving && (String(p.reg_no).toLowerCase().indexOf(q) !== -1 || String(p.name).toLowerCase().indexOf(q) !== -1);
      });
      if (!ids.length) return null;
      var av = st.people[ids[0]];
      focusAvatar(av);
      return { person: av.userData.person, state: stateOf(av.userData.person) };
    }

    function mount(host, opts) {
      dispose();
      opts = opts || {};
      if (!webglOk()) return Promise.reject(new Error('This browser cannot draw 3D (WebGL is off).'));
      return loadThree().then(function (THREE) {
        T = THREE;
        if (!host.isConnected) throw new Error('closed');
        var renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = T.PCFSoftShadowMap;
        renderer.outputEncoding = T.sRGBEncoding;
        host.insertBefore(renderer.domElement, host.firstChild);
        var scene = new T.Scene();
        var camera = new T.PerspectiveCamera(38, 1, 0.1, 200);
        var night = document.documentElement.getAttribute('data-theme') === 'dark';
        scene.add(new T.HemisphereLight(0xffffff, night ? 0x1b2420 : 0xcfc8b8, night ? 0.5 : 0.85));
        var sun = new T.DirectionalLight(0xffffff, night ? 0.5 : 0.75);
        sun.position.set(-8, 18, 10); sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.camera.left = -16; sun.shadow.camera.right = 16; sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
        scene.add(sun);
        var controls = new Orbit(camera, renderer.domElement);
        st = { host: host, renderer: renderer, scene: scene, camera: camera, controls: controls, clock: new T.Clock(), people: {}, onPick: opts.onPick, onCounts: opts.onCounts };
        camera.position.set(0, 18, 26);
        controls.target.set(0, 0, 1.2);
        controls.onStart = function () { if (st) st.fly = null; }; // the person takes over the camera
        homeView();
        var down = null;
        renderer.domElement.addEventListener('pointerdown', function (e) { down = [e.clientX, e.clientY]; });
        renderer.domElement.addEventListener('pointerup', function (e) {
          if (down && Math.abs(e.clientX - down[0]) + Math.abs(e.clientY - down[1]) < 6) pickAt(e);
          down = null;
        });
        st.ro = window.ResizeObserver ? new ResizeObserver(resize) : null;
        if (st.ro) st.ro.observe(host); else window.addEventListener('resize', resize);
        resize();
        tick();
      });
    }

    function dispose() {
      if (!st) return;
      cancelAnimationFrame(st.raf);
      if (st.ro) st.ro.disconnect();
      try { st.renderer.dispose(); st.renderer.forceContextLoss && st.renderer.forceContextLoss(); } catch (e) {}
      if (st.renderer.domElement.parentNode) st.renderer.domElement.parentNode.removeChild(st.renderer.domElement);
      st = null;
    }

    return {
      /** Starts downloading the 3D engine in the background so the 3D tab opens quickly. */
      preload: function () { if (webglOk()) loadThree().catch(function () {}); },
      mount: mount,
      update: update,
      find: find,
      home: function () { if (st) { st.focusId = null; homeView(); } },
      dispose: dispose,
      mountedOn: function (host) { return !!(st && st.host === host); }
    };
  })();
</script>
